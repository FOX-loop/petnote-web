<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E7E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="貓貓筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>貓貓筆記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：單欄手機 App。上方寵物切換、中間內容、下方四個分頁。招牌元素是驅蟲「集章」格，像寵物健康手冊蓋章。 */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E3EBE8; --ink:#14262B; --ink2:#52666B; --line:#D2DDDA;
  --primary:#0F6E7E; --on-primary:#FFFFFF; --primary-soft:#D5EBEE;
  --accent:#D9691F; --accent-soft:#FBE5D2;
  --ok:#277D50; --ok-soft:#D6EFE1; --bad:#B93B35; --bad-soft:#F8DCD9;
  --shadow:0 1px 2px rgba(20,38,43,.06),0 6px 18px rgba(20,38,43,.06);
  --scrim:rgba(10,20,22,.5);
  --ts:55%; --tl:34%; --bs:62%; --bl:91%;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --navpad:0px;
  --font:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --surface2:#1F2F34; --ink:#E4EEEC; --ink2:#9BB0B3; --line:#2B3E43;
    --primary:#5CC1D0; --on-primary:#06262B; --primary-soft:#173B41;
    --accent:#F29A5B; --accent-soft:#41291A;
    --ok:#5CCB93; --ok-soft:#173528; --bad:#F27D75; --bad-soft:#401E1C;
    --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
    --ts:68%; --tl:74%; --bs:32%; --bl:21%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --surface2:#1F2F34; --ink:#E4EEEC; --ink2:#9BB0B3; --line:#2B3E43;
  --primary:#5CC1D0; --on-primary:#06262B; --primary-soft:#173B41;
  --accent:#F29A5B; --accent-soft:#41291A;
  --ok:#5CCB93; --ok-soft:#173528; --bad:#F27D75; --bad-soft:#401E1C;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  --ts:68%; --tl:74%; --bs:32%; --bl:21%;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:var(--scrim);padding:24px}
.busy .dlg{transform:none;opacity:1;text-align:center}
.busy .dlg p{margin:0}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:block;flex:none}
b{font-weight:700}
small{font-size:12.5px;color:var(--ink2)}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
#top{flex:none;padding-top:10px;padding-bottom:6px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--primary)}
.today{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 8px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;max-width:60vw}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.pchip.add{padding:0;width:44px;justify-content:center;color:var(--primary);border-style:dashed}

.mainwrap{position:relative;flex:1;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-top:6px;padding-bottom:96px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.linkbtn{color:var(--primary);font-weight:600;font-size:14px;min-height:36px;padding:0 4px;display:flex;align-items:center;gap:2px}

.av{width:var(--s,48px);height:var(--s,48px);border-radius:30%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s,48px)*.42);color:hsl(var(--h,200) var(--ts) var(--tl));background:hsl(var(--h,200) var(--bs) var(--bl))}
.pchip .av{border-radius:50%}

.pet{border-radius:24px;padding:18px}
.pet-top{display:flex;gap:14px;align-items:center}
.pet-top .grow{flex:1;min-width:0}
.pet h1{margin:0;font-size:25px;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.pet .meta{color:var(--ink2);font-size:14px;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);background:var(--surface2);flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 0;border-top:1px dashed var(--line)}
.facts div{padding:10px 0 0}
.facts div+div{padding-left:14px;border-left:1px dashed var(--line)}
.facts dt{font-size:12.5px;color:var(--ink2)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.age{margin-top:14px;padding:14px;border-radius:14px;background:var(--primary-soft)}
.age-nums{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.age-nums span{font-size:15px;color:var(--primary)}
.age-nums b{font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-right:3px}
.age .sub{margin-top:6px;font-size:13.5px;color:var(--ink2)}
.age .party{margin-top:8px;display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent);color:var(--surface);font-weight:700;font-size:13.5px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}

.annbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.annbig b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.02em}
.annbig span{color:var(--ink2);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.todaybanner{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:var(--accent);color:var(--surface);font-weight:700}
.evlist{list-style:none;margin:10px 0 0;padding:0}
.evlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.evlist .when{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.evlist .nm{font-weight:600}
.evlist small{display:block}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.cnt{background:var(--primary-soft);color:var(--primary)}

.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cardhead+.wrow{border-top:0;padding-top:0}
.wrow .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mini{min-height:36px;padding:0 14px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px}

.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;color:hsl(var(--h,200) var(--ts) var(--tl));background:hsl(var(--h,200) var(--bs) var(--bl))}
.recent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.recent:first-of-type{border-top:0;padding-top:0}
.recent .tx{flex:1;min-width:0}
.recent .tx p{margin:2px 0 0;color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recent time{font-size:12.5px;color:var(--ink2);white-space:nowrap}

.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.pagehead h2{margin:0;font-size:22px;font-weight:800}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 14px 0;padding-right:max(16px,env(safe-area-inset-right,0px))}
.filters::-webkit-scrollbar{display:none}
.wcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.wcard .grow{flex:1;min-width:0}
.wcard .lb{font-size:12.5px;color:var(--ink2);display:block}
.wcard .kg{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wcard .kg small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:2px}
.wcard .sub{font-size:12.5px;color:var(--ink2);display:block}
.wcard svg{flex:none}
.delta{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface);color:var(--ink2);margin-left:6px;font-variant-numeric:tabular-nums;vertical-align:middle}
.wchart{position:relative;margin:4px 0 6px;touch-action:pan-y}
.wchart svg{display:block;width:100%;height:auto;overflow:visible}
.wchart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px}
.wstats div{background:var(--surface2);border-radius:12px;padding:8px;min-width:0}
.wstats small{display:block;font-size:11.5px}
.wstats b{font-size:15px;font-variant-numeric:tabular-nums}
.wkg{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:12px 0 4px}
.pager button{min-width:40px;height:40px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.pager button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .gap{min-width:16px;text-align:center;color:var(--ink2)}
.pageinfo{text-align:center;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.search{position:relative;margin:0 0 12px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2);pointer-events:none}
.search input{width:100%;min-height:46px;padding:10px 44px 10px 40px;border-radius:23px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);appearance:none;-webkit-appearance:none}
.search input:focus{outline:none;border-color:var(--primary)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.qinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:-2px 0 12px;font-size:14px;color:var(--ink2)}
.qinfo .seg button{min-height:34px;padding:0 12px;font-size:13px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--accent-soft)}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dayh{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.dayh:first-child{margin-top:0}
.dayh small{font-weight:600}
.entry{position:relative;display:flex;gap:12px;padding-bottom:12px;width:100%;text-align:left}
.entry .rail{flex:none;width:14px;position:relative;display:flex;justify-content:center}
.entry .rail::before{content:"";position:absolute;top:18px;bottom:-12px;width:2px;background:var(--line)}
.entry:last-child .rail::before{display:none}
.entry .dot{position:relative;margin-top:8px;width:12px;height:12px;border-radius:50%;background:hsl(var(--h,200) var(--ts) var(--tl));box-shadow:0 0 0 3px var(--bg)}
.ebody{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ehead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ehead time{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.note{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.thumbs button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);min-width:0}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--primary);color:var(--on-primary);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;padding:36px 12px;color:var(--ink2)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty p{margin:0 0 16px}
.empty .btn{margin:4px}

.yearnav{display:flex;align-items:center;gap:4px}
.yearnav b{min-width:64px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.yearnav button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.remindline{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--ink2);font-size:14px}
.remindline span{flex:1;min-width:0}
.stampcard h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stamp{aspect-ratio:1;min-width:0;border-radius:50%;border:1.5px solid var(--line);color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:13px;font-weight:600;background:var(--bg);font-variant-numeric:tabular-nums}
.stamp small{font-size:10.5px;color:inherit;opacity:.9}
.stamp.future{opacity:.55}
.stamp.now{border-color:var(--primary);color:var(--primary);border-width:2px}
.stamp.plan{border:2px dashed var(--accent);color:var(--accent)}
.stamp.done{border:0;color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 5px var(--accent-soft),inset 0 0 0 6px var(--accent);transform:rotate(var(--rot,0deg));font-weight:800}
.stamp.done{font-size:12.5px}
.stamp.done small{font-weight:700;font-size:10px}

.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:first-child{border-top:0}
.lrow .grow{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.seg button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.sechead{margin:22px 2px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.sechead:first-child{margin-top:4px}
.about{font-size:13px;color:var(--ink2);line-height:1.7;padding:4px 2px}

nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--navpad)}
nav.tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink2)}
nav.tabs .ico{width:46px;height:30px;border-radius:15px;display:grid;place-items:center}
nav.tabs button.on{color:var(--primary)}
nav.tabs button.on .ico{background:var(--primary-soft)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-weight:600;width:100%;text-align:left;line-height:1.35}
.alert span{flex:1;min-width:0;overflow-wrap:anywhere}
.alert svg{color:var(--accent)}
.alert.bad{background:var(--bad-soft)}
.alert.bad svg{color:var(--bad)}
.vnext{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vnext span{color:var(--ink2);font-size:14px}
.vnext b{font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hist{margin-top:12px;border-top:1px dashed var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hist .hrow:first-child,.yrh+.hrow{border-top:0}
.hrow .d{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.hrow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.hrow svg{color:var(--ink2)}
.yrh{margin:12px 0 2px;font-size:13px;font-weight:700;color:var(--ink2)}
.yrh:first-of-type{margin-top:0}
.itemcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.itemcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.itemcard .top b{min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:transparent;transition:background .2s}
.layer.open{background:var(--scrim)}
.layer.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:560px;max-height:calc(100% - var(--sat) - 12px);display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
.layer.open .sheet{transform:none}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;padding-bottom:8px}
.sheet-h h3{margin:0;font-size:18px;font-weight:800;overflow-wrap:anywhere}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding-top:6px;padding-bottom:18px;overscroll-behavior:contain}
.sheet-f{flex:none;display:flex;gap:10px;padding-top:10px;padding-bottom:14px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}

<script>
(function(){
'use strict';
/* ================= 基本工具 ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var ym=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var parseD=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var today=function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
var dayDiff=function(a,b){return Math.round((a-b)/864e5)};
var addDays=function(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)};
var addMonths=function(d,n){var t=new Date(d.getFullYear(),d.getMonth()+n,1);var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d.getDate(),last));return t};
var monthAdd=function(m,n){var a=m.split('-').map(Number);return ym(new Date(a[0],a[1]-1+n,1))};
var monthsBetween=function(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return (y[0]-x[0])*12+(y[1]-x[1])};
var WD=['日','一','二','三','四','五','六'];
var fmtD=function(s){return s?s.replace(/-/g,'/'):''};
var toLocalInput=function(ts){var d=new Date(ts);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
var hhmm=function(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
var lsGet=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var lsSet=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var APP_VERSION='1.8.0';
function isNative(){try{var c=window.Capacitor;return !!(c&&c.isNativePlatform&&c.isNativePlatform())}catch(e){return false}}
/* ---- App 版：檢查 GitHub 上的新版本 ---- */
var UPDATE_REPO='FOX-loop/petnote-web';
function verCmp(a,b){a=String(a).replace(/^v/i,'').split('.').map(Number);b=String(b).replace(/^v/i,'').split('.').map(Number);for(var i=0;i<3;i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x>y?1:-1}return 0}
var Updater={
  checking:false,last:null,
  async fetchLatest(){
    var r=await fetch('https://api.github.com/repos/'+UPDATE_REPO+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error('http '+r.status);
    var j=await r.json(),asset=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name)})[0];
    return {version:String(j.tag_name||'').replace(/^v/i,''),notes:j.body||'',url:asset?asset.browser_download_url:'https://github.com/'+UPDATE_REPO+'/releases/latest/download/PetNote.apk',page:j.html_url||('https://github.com/'+UPDATE_REPO+'/releases/latest'),size:asset?asset.size:0};
  },
  async check(manual){
    if(!isNative()||this.checking)return;
    if(!manual){var lc=+(lsGet('petnote.updChecked')||0);if(Date.now()-lc<6*3600e3)return}
    this.checking=true;
    try{
      var info=await this.fetchLatest();lsSet('petnote.updChecked',String(Date.now()));this.last=info;
      if(!info.version||verCmp(info.version,APP_VERSION)<=0){if(manual)infoDlg('已經是最新版本（'+APP_VERSION+'）。');return}
      if(!manual){var sn=JSON.parse(lsGet('petnote.updSnooze')||'{}');if(sn.v===info.version&&Date.now()<sn.until)return}
      this.prompt(info);
    }catch(e){if(manual)infoDlg('目前無法檢查更新，請確認網路連線後再試一次。')}
    finally{this.checking=false;var t=$('#updTxt');if(t)paintUpdTxt()}
  },
  prompt(info){
    var notes=info.notes.replace(/\r/g,'').split('\n').map(function(l){return l.replace(/^#+\s*/,'').replace(/\*\*/g,'').replace(/^[-*]\s+/,'・').trim()}).filter(Boolean).slice(0,10).join('\n');
    var el=document.createElement('div');el.className='layer center';
    el.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true" style="max-width:400px"><p style="margin:0 0 6px;font-size:18px;font-weight:800">有新版本 '+esc(info.version)+'</p><p style="margin:0 0 10px;font-size:13.5px;color:var(--ink2)">目前版本 '+esc(APP_VERSION)+(info.size?'・下載約 '+(info.size/1048576).toFixed(1)+' MB':'')+'</p>'+
      (notes?'<div style="max-height:40vh;overflow:auto;white-space:pre-line;font-size:14px;line-height:1.6;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:12px">'+esc(notes)+'</div>':'')+
      '<p style="margin:0 0 14px;font-size:13px;color:var(--ink2)">按「下載更新」後，等下載完成點開檔案，再按「更新」即可，資料會保留。</p>'+
      '<div class="row"><button class="btn" data-later>稍後再說</button><a class="btn primary" data-dl href="'+esc(info.url)+'" target="_blank" rel="noopener" style="text-decoration:none">下載更新</a></div></div>';
    el.addEventListener('click',function(e){
      if(e.target.closest('[data-later]')||e.target===el){lsSet('petnote.updSnooze',JSON.stringify({v:info.version,until:Date.now()+864e5}));closeTop();return}
      if(e.target.closest('[data-dl]')){lsSet('petnote.updSnooze',JSON.stringify({v:info.version,until:Date.now()+3600e3}));setTimeout(closeTop,300);toast('開始下載，完成後點開檔案按「更新」')}
    });
    pushLayer(el);
  }
};
function paintUpdTxt(){
  var t=$('#updTxt');if(!t)return;var i=Updater.last;
  t.innerHTML=Updater.checking?'正在檢查…':(i&&i.version&&verCmp(i.version,APP_VERSION)>0?'有新版本 '+esc(i.version)+'　<button class="linkbtn" data-act="updnow" style="display:inline-flex;padding:0;min-height:0">查看</button>':(i?'已是最新版本（'+esc(APP_VERSION)+'）':'開啟 App 時會自動檢查新版本'));
}
function apkUrl(){
  var m=/^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);if(!m)return '';
  var repo=(location.pathname.split('/').filter(Boolean)[0]||'');
  if(!repo||/\.html?$/i.test(repo))return '';
  return 'https://github.com/'+m[1]+'/'+repo+'/releases/latest/download/PetNote.apk';
}

/* ================= 類型與圖示 ================= */
var TYPES=[
  {id:'vomit',name:'嘔吐',h:18},{id:'stool',name:'軟便／腹瀉',h:38},{id:'appetite',name:'食慾不振',h:62},

];
var typeOf=function(id){return TYPES.filter(function(t){return t.id===id})[0]||TYPES[TYPES.length-1]};
var logLabel=function(l){return (l.type==='other'&&l.custom)?l.custom:typeOf(l.type).name};
var IC={
  home:'<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/>',

  syringe:'<path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',

};
var ico=function(n,s){s=s||22;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'};

/* ================= 日期計算 ================= */
function ageParts(b,now){
  if(b>now) return null;
  var total=(now.getFullYear()-b.getFullYear())*12+now.getMonth()-b.getMonth();
  if(addMonths(b,total)>now) total--;
  var base=addMonths(b,total);
  return {y:Math.floor(total/12),m:total%12,d:dayDiff(now,base)};
}
function nextAnn(d,now){
  var y=Math.max(now.getFullYear(),d.getFullYear()+1);
  for(var i=0;i<3;i++,y++){
    var last=new Date(y,d.getMonth()+1,0).getDate();
    var dt=new Date(y,d.getMonth(),Math.min(d.getDate(),last));
    if(dt>=now) return {date:dt,years:y-d.getFullYear()};
  }
  return null;
}
function annEvents(home,now){
  var ev=[],n=nextAnn(home,now);
  if(n){
    ev.push({label:'來家 '+n.years+' 週年',date:n.date});
    var d2=new Date(n.date.getFullYear()+1,home.getMonth(),home.getDate());
    ev.push({label:'來家 '+(n.years+1)+' 週年',date:d2});
  }
  [100,200,300,500,1000,1500,2000,2500,3000,4000,5000].forEach(function(k){
    var d=addDays(home,k-1); if(d>=now) ev.push({label:'來家第 '+k+' 天',date:d});
  });
  ev.sort(function(a,b){return a.date-b.date});
  return ev.slice(0,3);
}
function relDays(date,now){
  var n=dayDiff(date,now);
  return n===0?'就是今天':(n+' 天後');
}

/* ================= 資料層 (IndexedDB) ================= */
var DB={db:null,ok:false,
  open:function(){return new Promise(function(res){
    try{
      var r=indexedDB.open('petnote',4);
      r.onupgradeneeded=function(){var d=r.result;['pets','logs','worms','vaccines','meta','photos','thumbs'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
      r.onsuccess=function(){DB.db=r.result;DB.ok=true;res(true)};
      r.onerror=function(){res(false)};r.onblocked=function(){res(false)};
    }catch(e){res(false)}
  })},
  all:function(n){return new Promise(function(res){
    if(!DB.ok) return res([]);
    try{var q=DB.db.transaction(n).objectStore(n).getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}
  })},
  put:function(n,o){return new Promise(function(res){
    if(!DB.ok) return res(false);
    try{var t=DB.db.transaction(n,'readwrite');t.objectStore(n).put(o);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)};t.onabort=function(){res(false)}}catch(e){res(false)}
  })},
  get:function(n,id){return new Promise(function(res){
    if(!DB.ok) return res(null);
    try{var q=DB.db.transaction(n).objectStore(n).get(id);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}
  })},
  keys:function(n){return new Promise(function(res){
    if(!DB.ok) return res([]);
    try{var q=DB.db.transaction(n).objectStore(n).getAllKeys();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}
  })},
  del:function(n,id){return new Promise(function(res){
    if(!DB.ok) return res(false);
    try{var t=DB.db.transaction(n,'readwrite');t.objectStore(n).delete(id);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)}}catch(e){res(false)}
  })}
};
var warnedStore=false;
function saved(ok){ if(!ok&&!warnedStore){warnedStore=true;toast('目前無法永久儲存資料，關閉後可能消失')} }

function libGet(n){return S.lib.filter(function(x){return x.name===n})[0]||null}
function libAdd(n,every,remind,group){if(!n||libGet(n))return;S.lib.push({name:n,every:every||12,remind:(remind==null?14:remind),group:group||''});libDirty=true}
function groupGet(id){return S.groups.filter(function(g){return g.id===id})[0]||null}
function groupMembers(id){return S.lib.filter(function(l){return l.group===id}).map(function(l){return l.name})}
function trackKey(n){var l=libGet(n);return l&&l.group&&groupGet(l.group)?'g:'+l.group:n}
function unitOf(key){
  if(!key)return null;
  if(key.indexOf('g:')===0){var g=groupGet(key.slice(2));if(!g)return null;return {key:key,name:g.name,every:g.every,remind:g.remind,group:g.id,members:groupMembers(g.id)}}
  var l=libGet(key);if(!l)return null;
  if(l.group&&groupGet(l.group))return unitOf('g:'+l.group);
  return {key:key,name:l.name,every:l.every,remind:l.remind,group:'',members:[l.name]};
}
function speciesDefault(sp){return (SPECIES_DEFAULT[sp]||SPECIES_DEFAULT['其他']).filter(function(k){return !!unitOf(k)})}
function vItems(p){var seen={};return (p.vaccItems||[]).map(unitOf).filter(function(u){if(!u||seen[u.key])return false;seen[u.key]=1;return true})}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function normalizeTracks(p){
  var before=JSON.stringify(p.vaccItems||[]);
  p.vaccItems=uniq((p.vaccItems||[]).map(function(k){if(typeof k!=='string')return null;if(k.indexOf('g:')===0)return groupGet(k.slice(2))?k:null;return libGet(k)?trackKey(k):null}).filter(Boolean));
  return JSON.stringify(p.vaccItems)!==before;
}
async function normalizeAllPets(){for(var i=0;i<S.pets.length;i++){if(normalizeTracks(S.pets[i]))await savePet(S.pets[i])}}
function autoGroup(){
  /* 舊資料第一次升級：把名稱含「合一」的貓／狗疫苗各自歸成一個群組，沿用第一個疫苗原本的間隔與提醒 */
  S.groups=[];
  [['cat-core','貓綜合疫苗',/貓/],['dog-core','狗綜合疫苗',/狗|犬(?!病)/]].forEach(function(d){
    var ms=S.lib.filter(function(l){return !l.group&&/合一/.test(l.name)&&d[2].test(l.name)});
    if(!ms.length)return;
    S.groups.push({id:d[0],name:d[1],every:ms[0].every,remind:ms[0].remind});
    ms.forEach(function(l){l.group=d[0]});
  });
  libDirty=true;
}
function ensurePet(p){
  if(!Array.isArray(p.vaccItems)){p.vaccItems=speciesDefault(p.species);p._mig=true}
  else if(p.vaccItems.some(function(it){return typeof it!=='string'})){
    p.vaccItems=uniq(p.vaccItems.map(function(it){if(typeof it==='string')return it;libAdd(it.name,it.every,it.remind);return it.name}).filter(Boolean));p._mig=true;
  }
  if(normalizeTracks(p))p._mig=true;
  if(!Array.isArray(p.wormItems))p.wormItems=[];

function readImage(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function shrinkDataUrl(src,max,q){
  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      try{var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(src)}
    };
    img.onerror=function(){res(src)};
    img.src=src;
  });
}
/* ---- 照片：原圖與縮圖分開存放，畫面只在需要時讀取 ---- */
var Photos=(function(){
  var cache=new Map(),MAX=150,io=null;
  function remember(id,v){cache.delete(id);cache.set(id,v);if(cache.size>MAX)cache.delete(cache.keys().next().value)}
  function isId(x){return typeof x==='string'&&x.indexOf('ph_')===0}
  async function thumb(id){
    if(cache.has(id)){var v=cache.get(id);remember(id,v);return v}
    var r=await DB.get('thumbs',id);if(!r){var f=await DB.get('photos',id);if(f){r={id:id,data:await shrinkDataUrl(f.data,360,.72)};await DB.put('thumbs',r)}}
    if(r){remember(id,r.data);return r.data}return null;
  }
  async function full(id){var r=await DB.get('photos',id);return r?r.data:null}
  async function put(id,data,th){
    th=th||await shrinkDataUrl(data,360,.72);
    if(!await DB.put('photos',{id:id,data:data}))return false;
    if(!await DB.put('thumbs',{id:id,data:th})){await DB.del('photos',id);return false}
    remember(id,th);return true;
  }
  async function add(data,th){var id='ph_'+uid();return (await put(id,data,th))?id:null}
  async function remove(ids){for(var i=0;i<ids.length;i++){if(!isId(ids[i]))continue;cache.delete(ids[i]);await DB.del('photos',ids[i]);await DB.del('thumbs',ids[i])}}
  function load(img){
    var id=img.getAttribute('data-ph');if(!id||img.getAttribute('src'))return;
    img.setAttribute('data-loading','1');
    thumb(id).then(function(v){if(v&&img.getAttribute('data-ph')===id)img.src=v});
  }
  function hydrate(root){
    var imgs=$$('img[data-ph]:not([src])',root||document);if(!imgs.length)return;
    if(!('IntersectionObserver' in window)){imgs.forEach(load);return}
    if(!io)io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);load(e.target)}})},{rootMargin:'400px 0px'});
    imgs.forEach(function(i){if(!i.getAttribute('data-loading'))io.observe(i)});
  }
  return {isId:isId,thumb:thumb,full:full,put:put,add:add,remove:remove,hydrate:hydrate,cached:function(id){return cache.get(id)||''}};
})();
async function migratePhotos(){
  var todo=S.logs.filter(function(l){return (l.photos||[]).some(function(p){return !Photos.isId(p)})});
  if(!todo.length)return;
  var failed=false;
  var total=todo.reduce(function(n,l){return n+l.photos.filter(function(p){return !Photos.isId(p)}).length},0),done=0;
  var m=$('#main');
  for(var i=0;i<todo.length;i++){
    var l=todo[i],ids=[];
    for(var j=0;j<l.photos.length;j++){
      var p=l.photos[j];
      if(Photos.isId(p)){ids.push(p);continue}
      if(typeof p==='string'&&p.indexOf('data:')===0){
        var nid=await Photos.add(p);
        if(!nid){ids=ids.concat(l.photos.slice(j));failed=true;break}
        ids.push(nid);
      }
      done++;if(m)m.innerHTML='<div class="empty"><h3>正在整理照片</h3><p>第 '+done+' / '+total+' 張，只有這一次，請不要關閉 App。</p></div>';
    }
    if(!await DB.put('logs',Object.assign({},l,{photos:ids}))){failed=true}
    else l.photos=ids;
    if(failed)break;
  }
  if(failed)setTimeout(function(){toast('手機空間不足，部分照片尚未整理完成，原照片都保留著。清出空間後重新開啟 App 會繼續。')},600);
}

var Layers=[];
function pushLayer(el,onClose){
  document.body.appendChild(el);
  var hist=true;try{history.pushState({layer:Layers.length+1},'')}catch(e){hist=false}
  var L={el:el,hist:hist,onClose:onClose};Layers.push(L);
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('open')})});
  return L;
}
function removeTop(){
  var L=Layers.pop();if(!L)return;
  L.el.classList.remove('open');setTimeout(function(){L.el.remove()},240);
  if(L.onClose)L.onClose();
}
function closeTop(){
  var n=Layers.length;if(!n)return;var L=Layers[n-1];
  if(L.hist){history.back();setTimeout(function(){if(Layers.length===n&&Layers[n-1]===L)removeTop()},400)}
  else removeTop();
}

function itemStatus(pet,item,cm){
  var done=S.worms.filter(function(w){return w.id===wid(pet.id,cm,item.name)})[0];
  if(done) return {state:'done',rec:done};
  var prev=S.worms.filter(function(w){return w.petId===pet.id&&w.item===item.name&&w.month<cm}).sort(function(a,b){return a.month<b.month?1:-1})[0];
  if(!prev) return {state:'due'};
  if(monthsBetween(prev.month,cm)>=item.every) return {state:'due',last:prev};
  return {state:'wait',next:monthAdd(prev.month,item.every),last:prev};
}
function planMonth(pet,item,cm){
  var last=S.worms.filter(function(w){return w.petId===pet.id&&w.item===item.name}).sort(function(a,b){return a.month<b.month?1:-1})[0];
  if(!last) return cm;
  var nx=monthAdd(last.month,item.every);
  return nx<cm?cm:nx;
}

/* ================= 體重 ================= */
function fmtKg(v){return (Math.round(v*100)/100).toString()}
function weightPoints(pid){
  var pts=[];
  S.logs.forEach(function(l){if(l.petId===pid&&l.type==='weight'&&+l.weight>0)pts.push({t:l.ts,kg:+l.weight,src:'log',id:l.id,note:l.note||''})});
  S.vaccs.forEach(function(v){if(v.petId===pid&&+v.weight>0){var d=parseD(v.date);pts.push({t:new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime(),kg:+v.weight,src:'vacc',id:v.id,note:v.item})}});
  return pts.sort(function(a,b){return a.t-b.t});
}
function weightDelta(l){var pts=weightPoints(l.petId),i=-1;pts.forEach(function(x,k){if(x.src==='log'&&x.id===l.id)i=k});return i>0?pts[i].kg-pts[i-1].kg:null}
function deltaHtml(d){if(d==null||Math.abs(d)<0.005)return d==null?'':'<span class="delta">持平</span>';return '<span class="delta">'+(d>0?'+':'−')+fmtKg(Math.abs(d))+' kg</span>'}
function sparkSvg(pts,w,h){
  var v=pts.slice(-10);if(v.length<2)return '';
  var t0=v[0].t,t1=v[v.length-1].t,lo=Math.min.apply(null,v.map(function(p){return p.kg})),hi=Math.max.apply(null,v.map(function(p){return p.kg}));
  if(hi-lo<0.2){var m=(hi+lo)/2;lo=m-0.1;hi=m+0.1}
  var X=function(t){return 3+(w-6)*(t1===t0?1:(t-t0)/(t1-t0))},Y=function(k){return 4+(h-8)*(1-(k-lo)/(hi-lo))};
  var d=v.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.kg).toFixed(1)}).join(' ');
  var last=v[v.length-1];
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path d="'+d+' L'+X(last.t).toFixed(1)+' '+h+' L'+X(v[0].t).toFixed(1)+' '+h+' Z" fill="var(--primary)" opacity=".12"/><path d="'+d+'" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+X(last.t).toFixed(1)+'" cy="'+Y(last.kg).toFixed(1)+'" r="3.5" fill="var(--primary)" stroke="var(--surface2)" stroke-width="2"/></svg>';
}
function weightCardHtml(p){

function pagerHtml(page,pages,attr){
  if(pages<=1)return '';

  var nums=[],set={};
  [1,pages,page-1,page,page+1].forEach(function(p){if(p>=1&&p<=pages&&!set[p]){set[p]=1;nums.push(p)}});
  if(page<=3)[2,3,4].forEach(function(p){if(p<=pages&&!set[p]){set[p]=1;nums.push(p)}});
  if(page>=pages-2)[pages-3,pages-2,pages-1].forEach(function(p){if(p>=1&&!set[p]){set[p]=1;nums.push(p)}});
  nums.sort(function(a,c){return a-c});
  var h=b(page-1,'‹','上一頁',page===1,false),last=0;
  nums.forEach(function(p){if(p-last>1)h+='<span class="gap">…</span>';h+=b(p,p,'第 '+p+' 頁',false,p===page);last=p});
  return '<nav class="pager" aria-label="分頁">'+h+b(page+1,'›','下一頁',page===pages,false)+'</nav>';

function niceStep(range,count){var raw=range/Math.max(1,count),p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function weightChart(pts){
  if(!pts.length)return '';
  var W=340,H=196,L=38,R=14,T=26,B=24;
  var t0=pts[0].t,t1=pts[pts.length-1].t;if(t1===t0){t0-=864e5*15;t1+=864e5*15}
  var lo=Math.min.apply(null,pts.map(function(p){return p.kg})),hi=Math.max.apply(null,pts.map(function(p){return p.kg}));
  if(hi-lo<0.4){var mid=(hi+lo)/2;lo=mid-0.2;hi=mid+0.2}
  var st=niceStep(hi-lo,4);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;
  var X=function(t){return L+(W-L-R)*(t-t0)/(t1-t0)},Y=function(k){return T+(H-T-B)*(1-(k-lo)/(hi-lo))};
  var g='';
  for(var k=lo;k<=hi+1e-9;k+=st){var y=Y(k).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+y+'" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="var(--ink2)">'+fmtKg(k)+'</text>'}
  var fd=function(t){var d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)};
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="10.5" fill="var(--ink2)">'+fd(pts[0].t)+'</text>';
  if(pts.length>1)g+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10.5" fill="var(--ink2)">'+fd(pts[pts.length-1].t)+'</text>';
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.kg).toFixed(1)}).join(' ');
  var area=pts.length>1?'<path d="'+line+' L'+X(pts[pts.length-1].t).toFixed(1)+' '+(H-B)+' L'+X(pts[0].t).toFixed(1)+' '+(H-B)+' Z" fill="var(--primary)" opacity=".1"/>':'';
  var many=pts.length>40;
  var dots=pts.map(function(p,i){var last=i===pts.length-1;if(many&&!last)return '';return '<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="'+(last?5:4)+'" fill="'+(p.src==='vacc'?'var(--surface)':'var(--primary)')+'" stroke="var(--primary)" stroke-width="2"/>'}).join('');
  var lp=pts[pts.length-1];
  var lab='<text x="'+Math.min(X(lp.t),W-R).toFixed(1)+'" y="'+(Y(lp.kg)-12).toFixed(1)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+fmtKg(lp.kg)+' kg</text>';
  var json=JSON.stringify(pts.map(function(p){return [X(p.t),Y(p.kg)]}));
  return '<div class="wchart" data-pts=\''+json+'\'><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="體重變化折線圖，最新 '+fmtKg(lp.kg)+' 公斤">'+g+area+(pts.length>1?'<path d="'+line+'" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+dots+lab+'<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/></svg><div class="tip" hidden></div></div>';
}

      box.addEventListener('click',function(e){var pg=e.target.closest('[data-wpg]');if(pg){if(pg.disabled)return;page=+pg.getAttribute('data-wpg');paintList();var hd=$('#w-listhead',box);if(hd)hd.scrollIntoView({block:'start'});return}var r=e.target.closest('[data-wid]');if(!r)return;if(r.dataset.wsrc==='vacc')openVaccSheet(null,r.dataset.wid);else openLogSheet(r.dataset.wid)});

var EVERY_OPTS=[3,6,12,24,36],REMIND_OPTS=[-1,0,1,3,7,14,30];
function everyLabel(n){return n===12?'每年':(n%12===0?'每 '+(n/12)+' 年':(n===1?'每月':'每 '+n+' 個月'))}
function remindLabel(r){return r<0?'不提醒':(r===0?'到期當天提醒':'提前 '+r+' 天提醒')}
function optList(list,val,fn){
  var l=list.indexOf(val)<0?list.concat([val]).sort(function(a,b){return a-b}):list;
  return l.map(function(n){return '<option value="'+n+'" '+(n===val?'selected':'')+'>'+fn(n)+'</option>'}).join('');
}
function vaccStatus(p,it,now){
  var mem=it.members||[it.name];
  var recs=S.vaccs.filter(function(v){return v.petId===p.id&&mem.indexOf(v.item)>=0}).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(b.id>a.id?1:-1))});
  if(!recs.length)return {state:'none',recs:recs};
  var last=recs[0],due=last.next?parseD(last.next):addMonths(parseD(last.date),it.every),days=dayDiff(due,now);
  var state=days<0?'overdue':((it.remind>=0&&days<=it.remind)?'soon':'ok');
  return {state:state,last:last,due:due,days:days,recs:recs};
}
function vaccChip(st,it){
  if(st.state==='none')return '<span class="pill">尚無紀錄</span>';
  var txt=st.days<0?'已逾期 '+(-st.days)+' 天':(st.days===0?'今天到期':'還有 '+st.days+' 天');
  var warn=it.remind>=0&&(st.state==='overdue'||st.state==='soon');
  return '<span class="pill '+(warn?'warn':'')+'">'+txt+'</span>';
}
function alertsAll(now){
  var out=[];
  S.pets.forEach(function(p){
    vItems(p).forEach(function(it){
      if(it.remind<0)return;
      var st=vaccStatus(p,it,now);if(st.state!=='soon'&&st.state!=='overdue')return;
      out.push({tone:st.state==='overdue'?'bad':'warn',pid:p.id,tab:'vaccine',text:p.name+'・'+it.name+' '+(st.days<0?'已逾期 '+(-st.days)+' 天':(st.days===0?'今天到期':st.days+' 天後到期'))});
    });
    if(p.wormRemind&&now.getDate()>=p.wormDay){
      var cm=ym(now),names=(p.wormItems||[]).filter(function(it){return itemStatus(p,it,cm).state==='due'}).map(function(it){return it.name});
      if(names.length)out.push({tone:'warn',pid:p.id,tab:'deworm',text:p.name+'・本月驅蟲待辦：'+names.join('、')});
    }
  });
  return out;
}
function alertsHtml(now){

    '<div class="field"><label for="lf-time">發生時間</label><input id="lf-time" type="datetime-local" value="'+toLocalInput(l.ts)+'"></div>'+
    '<div class="field"><label for="lf-note">說明</label><textarea id="lf-note" placeholder="次數、顏色、當時在做什麼、吃了什麼…">'+esc(l.note)+'</textarea></div>'+
    '<div class="field"><span class="lbl">照片（最多 6 張）</span><div class="pickrow" id="lf-photos"></div><input id="lf-file" class="vh" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true"></div>';
  var footer=(ex?'<button class="btn danger" id="lf-del">刪除</button>':'')+'<button class="btn primary" id="lf-save">'+(ex?'儲存':'新增紀錄')+'</button>';
  openSheet({title:(ex?'編輯':'記錄')+(l.type==='weight'?'體重':'狀況')+'・'+p.name,body:body,footer:footer,onMount:function(el){
    var file=$('#lf-file',el),grid=$('#lf-photos',el),origIds=(ex&&ex.photos||[]).slice(),busy=false;
    function paint(){
      grid.innerHTML=l.photos.map(function(it,i){
        var img=typeof it==='string'&&!Photos.isId(it)?'<img src="'+it+'" alt="">':typeof it==='string'?'<img data-ph="'+esc(it)+'"'+(Photos.cached(it)?' src="'+Photos.cached(it)+'"':'')+' alt="">':'<img src="'+it.thumb+'" alt="">';
        return '<div class="ph">'+img+'<button type="button" class="rm" data-rm="'+i+'" aria-label="移除照片">'+ico('x',16)+'</button></div>'}).join('')+
        (l.photos.length<6?'<button type="button" class="addph" data-add>'+ico('cam',22)+'加照片</button>':'');
      Photos.hydrate(grid);
    }
    paint();
    grid.addEventListener('click',function(e){
      var rm=e.target.closest('[data-rm]');
      if(rm){l.photos.splice(+rm.dataset.rm,1);paint();return}
      if(e.target.closest('[data-add]'))file.click();
    });
    file.onchange=async function(){
      var fs=Array.prototype.slice.call(file.files||[]),bad=0,before=l.photos.length;
      busy=true;
      for(var i=0;i<fs.length&&l.photos.length<6;i++){try{var full=await readImage(fs[i],1280,.8);l.photos.push({data:full,thumb:await shrinkDataUrl(full,360,.72)})}catch(e){bad++}}
      busy=false;
      if(bad)toast('有 '+bad+' 張圖片無法讀取');
      else if(fs.length>l.photos.length-before)toast('照片最多 6 張，多的已略過');
      file.value='';paint();
    };
    bindSeg($('#lf-type',el),function(v){$('#lf-customwrap',el).hidden=v!=='other';$('#lf-wwrap',el).hidden=v!=='weight';if(v==='weight')setTimeout(function(){$('#lf-weight',el).focus()},50)});
    if(l.type==='weight'&&!ex)setTimeout(function(){var w=$('#lf-weight',el);if(w)w.focus()},300);
    $('#lf-save',el).onclick=async function(){
      var v=$('#lf-time',el).value,ts=v?new Date(v).getTime():Date.now();
      if(isNaN(ts)){toast('請選擇發生時間');return}
      l.type=segVal($('#lf-type',el))||'other';l.custom=l.type==='other'?$('#lf-custom',el).value.trim():'';
      if(busy){toast('照片還在處理中，請稍等一下');return}
      if(l.type==='weight'){
        var wr=$('#lf-weight',el).value.trim().replace(',','.'),wv=Math.round(parseFloat(wr)*100)/100;
        if(!(wv>0)||wv>150){toast('請輸入體重公斤數，例如 4.25');$('#lf-weight',el).focus();return}
        l.weight=wv;
      }else delete l.weight;
      l.ts=ts;l.note=$('#lf-note',el).value.trim();
      var ids=[],added=[];
      for(var k=0;k<l.photos.length;k++){
        var it=l.photos[k];
        if(typeof it==='string'){ids.push(it);continue}
        var nid=await Photos.add(it.data,it.thumb);
        if(!nid){await Photos.remove(added);toast('手機空間不足，照片沒有存成功。請清出空間後再試一次。');return}
        added.push(nid);ids.push(nid);
      }
      l.photos=ids;
      await saveLog(l);
      await Photos.remove(origIds.filter(function(x){return ids.indexOf(x)<0}));
      closeTop();S.filter='all';render();toast(ex?'已儲存':'已新增紀錄');
    };
    var del=$('#lf-del',el);
    if(del)del.onclick=async function(){
      var ok=await confirmDlg('刪除這筆狀況紀錄？','刪除',true);if(!ok)return;
      await removeLog(l.id);closeTop();render();toast('已刪除');
    };
  }});
}
function openViewer(logId,idx){
  var l=S.logs.filter(function(x){return x.id===logId})[0];if(!l||!l.photos||!l.photos.length)return;
  var i=idx,n=l.photos.length,el=document.createElement('div');el.className='layer viewer';

      (n>1?'<div class="vnav gut"><button data-go="-1" aria-label="上一張">'+ico('cl')+'</button><button data-go="1" aria-label="下一張">'+ico('cr')+'</button></div>':'');
    if(!Photos.isId(pid)){var im0=$('.vimg img',el);if(im0)im0.src=pid;return}

async function exportData(){
  if(exportData.busy)return;exportData.busy=true;
  try{
    var name='貓貓筆記備份-'+ymd(new Date())+'.json';
    var ids=[];S.logs.forEach(function(l){(l.photos||[]).forEach(function(p){if(Photos.isId(p))ids.push(p)})});
    var head=JSON.stringify({app:'petnote',version:4,exported:new Date().toISOString(),vaccLib:S.lib,vaccGroups:S.groups,pets:S.pets,logs:S.logs,worms:S.worms,vaccines:S.vaccs});
    head=head.slice(0,-1)+',"photos":{';
    var cap=window.Capacitor,P=cap&&cap.Plugins,native=isNative()&&P&&P.Filesystem&&P.Share;
    var blob=native?null:new Blob([head],{type:'application/json'}),parts=[],first=true;
    if(native)await P.Filesystem.writeFile({path:name,data:head,directory:'CACHE',encoding:'utf8'});
    async function flush(){
      if(!parts.length)return;
      var chunk=parts.join('');parts=[];
      if(native)await P.Filesystem.appendFile({path:name,data:chunk,directory:'CACHE',encoding:'utf8'});
      else blob=new Blob([blob,chunk],{type:'application/json'});
    }
    for(var i=0;i<ids.length;i++){
      var data=await Photos.full(ids[i]);if(!data)continue;
      parts.push((first?'':',')+JSON.stringify(ids[i])+':'+JSON.stringify(data));first=false;
      if(parts.length>=10){await flush();toast('正在匯出照片 '+(i+1)+' / '+ids.length)}
    }
    parts.push('}}');await flush();
    if(native){
      var u=await P.Filesystem.getUri({path:name,directory:'CACHE'});
      try{await P.Share.share({title:name,url:u.uri,dialogTitle:'儲存或分享備份檔'})}catch(e){}
      return;
    }
    try{
      var file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
    }catch(e){ if(e&&e.name==='AbortError')return; }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    toast('已產生備份檔');
  }catch(e){toast('匯出失敗，請確認手機空間是否足夠')}
  finally{exportData.busy=false}
}

  if(!await confirmDlg(summary,'匯入'))return;
  try{
    Busy.show('正在匯入…');
    var np=0,nl=0,nw=0,nv=0,nph=0,bad=0,i,j,photos=d.photos||{};
    (d.vaccGroups||[]).forEach(function(g){if(g&&g.id&&g.name&&!groupGet(g.id)){S.groups.push({id:g.id,name:g.name,every:+g.every||12,remind:g.remind==null?14:+g.remind});libDirty=true}});
    (d.vaccLib||[]).forEach(function(l){if(l&&l.name){var g=libGet(l.name);if(!g)libAdd(l.name,+l.every||12,l.remind==null?14:+l.remind,l.group&&groupGet(l.group)?l.group:'')}});
    for(i=0;i<d.pets.length;i++){if(d.pets[i]&&d.pets[i].id&&d.pets[i].name){await savePet(ensurePet(d.pets[i]));np++}}
    if(libDirty)await saveLib();
    var logs=d.logs||[];
    for(i=0;i<logs.length;i++){
      var l=logs[i];if(!(l&&l.id&&l.petId))continue;
      var ids=[];
      for(j=0;j<(l.photos||[]).length;j++){
        var p=l.photos[j];
        if(Photos.isId(p)){if(photos[p]){if(await Photos.put(p,photos[p])){nph++;ids.push(p)}else{bad++;ids.push(photos[p])}photos[p]=null}else ids.push(p)}
        else if(typeof p==='string'&&p.indexOf('data:')===0){var nid=await Photos.add(p);if(nid){ids.push(nid);nph++}else{bad++;ids.push(p)}}
        Busy.show('正在匯入照片 '+(nph+bad)+' / '+photoCount+' 張…');
      }
      l.photos=ids;await saveLog(l);nl++;
      if(!photoCount&&nl%20===0)Busy.show('正在匯入狀況紀錄 '+nl+' / '+logs.length+' 筆…');
    }
    Busy.show('正在匯入驅蟲與預防針…');
    for(i=0;i<(d.worms||[]).length;i++){var w=d.worms[i];if(w&&w.id&&w.petId){await saveWorm(w);nw++}}
    for(i=0;i<(d.vaccines||[]).length;i++){var v=d.vaccines[i];if(v&&v.id&&v.petId){await saveVacc(v);nv++}}
    await normalizeAllPets();
    if(!curPet()&&S.pets.length)S.sel=S.pets[0].id;
    Busy.hide();render();
    await infoDlg('匯入完成！\n'+np+' 隻寵物、'+nl+' 筆狀況（'+nph+' 張照片）\n'+nw+' 筆驅蟲、'+nv+' 筆預防針'+(bad?'\n\n手機空間不足，有 '+bad+' 張照片先保留原檔，清出空間後重新開啟會自動整理。':''));
  }catch(e){Busy.hide();render();await infoDlg('匯入到一半發生問題，已匯入的部分都保留著。\n可能是手機空間不足，清出空間後再匯入一次即可（重複匯入不會產生重複資料）。')}
}

/* ================= 手機通知（僅 Android App） ================= */
var Notif=(function(){
  var timer=null;
  function plug(){try{var c=window.Capacitor;if(c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.LocalNotifications)return c.Plugins.LocalNotifications}catch(e){}return null}
  async function status(){var P=plug();if(!P)return 'web';try{var r=await P.checkPermissions();return r.display||'prompt'}catch(e){return 'error'}}
  async function ask(){var P=plug();if(!P)return 'web';try{var r=await P.requestPermissions();return r.display||'denied'}catch(e){return 'error'}}
  function anyReminder(){return S.pets.some(function(p){return p.wormRemind||vItems(p).some(function(i){return i.remind>=0})})}
  function build(){
    var out=[],now=new Date(),td=today();
    var at=function(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0,0)};
    S.pets.forEach(function(p){
      vItems(p).forEach(function(it){
        if(it.remind<0)return;
        var st=vaccStatus(p,it,td);if(!st.due)return;
        var t1=at(addDays(st.due,-it.remind));
        if(t1>now)out.push({t:t1,title:p.name+'的預防針提醒',body:it.name+(it.remind===0?'今天到期':'將在 '+it.remind+' 天後（'+fmtD(ymd(st.due))+'）到期')});
        if(it.remind>0){var t2=at(st.due);if(t2>now)out.push({t:t2,title:p.name+'的預防針提醒',body:it.name+'今天到期'})}
      });
      if(p.wormRemind){
        for(var k=0;k<3;k++){
          var md=new Date(now.getFullYear(),now.getMonth()+k,p.wormDay),cm=ym(md),t=at(md);
          if(t<=now)continue;
          var names=(p.wormItems||[]).filter(function(it){return itemStatus(p,it,cm).state==='due'}).map(function(it){return it.name});
          if(names.length)out.push({t:t,title:p.name+'的驅蟲提醒',body:'今天該驅蟲了：'+names.join('、')});
        }
      }
    });
    out.sort(function(a,b){return a.t-b.t});
    return out.slice(0,60).map(function(o,i){return {id:i+1,title:o.title,body:o.body,schedule:{at:o.t,allowWhileIdle:true}}});
  }
  async function run(){
    var P=plug();if(!P)return;
    try{
      if(await status()!=='granted')return;
      var pend=await P.getPending();
      if(pend&&pend.notifications&&pend.notifications.length)await P.cancel({notifications:pend.notifications.map(function(n){return {id:n.id}})});
      var list=build();
      if(list.length)await P.schedule({notifications:list});
    }catch(e){}
  }
  function queue(){clearTimeout(timer);timer=setTimeout(run,800)}
  async function ensure(){
    if(!plug()||!anyReminder()||lsGet('petnote.notifAsked'))return;
    lsSet('petnote.notifAsked','1');
    var st=await status();
    if(st==='prompt'||st==='prompt-with-rationale')await ask();
    queue();
  }
  async function test(){
    var P=plug();if(!P)return false;
    try{await P.schedule({notifications:[{id:9999,title:'貓貓筆記',body:'這是測試通知，看到這則代表提醒功能正常。',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});return true}catch(e){return false}
  }
  return {status:status,ask:ask,ensure:ensure,test:test,sync:queue};
})();
async function updateStorage(){
  var t=$('#storeTxt');if(!t)return;
  var nPh=(await DB.keys('photos')).length,txt='目前有 '+S.logs.length+' 筆狀況、'+nPh+' 張照片';
  try{if(navigator.storage&&navigator.storage.estimate){var e=await navigator.storage.estimate();if(e&&e.usage)txt+='，約佔 '+(e.usage/1048576).toFixed(1)+' MB'}}catch(err){}
  if($('#storeTxt'))$('#storeTxt').textContent=txt+'。';
}
async function updateBuild(){
  paintUpdTxt();
  var t=$('#buildTxt');if(!t||!isNative())return;
  try{var A=window.Capacitor.Plugins.App;if(!A)return;var i=await A.getInfo();if($('#buildTxt'))$('#buildTxt').textContent='　版本代碼 '+i.build}catch(e){}
}
async function updateNotifCard(){
  updateStorage();updateBuild();
  var st=await Notif.status(),t=$('#notifTxt'),b=$('#notifBtns');
  if(!t||!b)return;
  var msg={
    web:'網頁版不會跳出手機通知，快到期的預防針與本月驅蟲會顯示在首頁最上方。Android 手機安裝 App 版，才會在早上 9:00 跳通知。',
    granted:'通知已開啟。預防針與驅蟲會依你設定的提醒時間，在早上 9:00 通知你。',
    denied:'通知被關閉了。請到手機「設定 → 應用程式 → 貓貓筆記 → 通知」開啟。',
    error:'暫時無法確認通知狀態。'
  };
  t.textContent=msg[st]||'尚未允許通知，開啟後才能收到提醒。';
  b.innerHTML=st==='granted'?'<button class="btn block" data-act="notiftest" style="margin-top:12px">傳送測試通知</button>':((st==='prompt'||st==='prompt-with-rationale')?'<button class="btn primary block" data-act="notifask" style="margin-top:12px">開啟通知</button>':'');
}

/* ================= 事件 ================= */
document.addEventListener('click',function(e){
  var tp=e.target.closest('[data-tlpg]');
  if(tp){if(tp.disabled)return;S.tlPage=+tp.getAttribute('data-tlpg');refreshTl();var sb=$('.search')||$('#tlBody');if(sb)sb.scrollIntoView({block:'start'});return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='tab'){S.tab=t.dataset.tab;$('#main').scrollTop=0;render()}
  else if(a==='selpet'){S.sel=t.dataset.id;lsSet('petnote.sel',S.sel);S.filter='all';S.tlLimit=30;S.tlPage=1;S.vOpen={};render()}
  else if(a==='addpet')openPetSheet();
  else if(a==='editpet')openPetSheet(t.dataset.id||S.sel);
  else if(a==='addlog')openLogSheet();
  else if(a==='weights')openWeights();
  else if(a==='updcheck'){Updater.check(true);paintUpdTxt()}
  else if(a==='updnow'){if(Updater.last)Updater.prompt(Updater.last)}
  else if(a==='editlog')openLogSheet(t.dataset.id);
  else if(a==='filter'){S.filter=t.dataset.f;S.tlLimit=30;S.tlPage=1;refreshTl()}

  else if(a==='qclear'){S.q='';S.filter='all';S.tlLimit=30;S.tlPage=1;renderMain();var qi=$('#tl-q');if(qi)qi.focus()}
  else if(a==='qscope'){S.qAll=t.dataset.v==='1';S.tlLimit=30;S.tlPage=1;refreshTl()}
  else if(a==='vmore'){var vn=t.dataset.item;S.vOpen[vn]=!S.vOpen[vn];renderMain()}
  else if(a==='setyear'){S.year=+t.dataset.y;renderMain()}
  else if(a==='photo')openViewer(t.dataset.id,+t.dataset.idx);
  else if(a==='year'){S.year+=+t.dataset.d;renderMain()}
  else if(a==='wormdone')openWormSheet(t.dataset.item,t.dataset.month);
  else if(a==='wormset')openWormSettings();
  else if(a==='sample')loadSample();
  else if(a==='export')exportData();
  else if(a==='vaccadd')openVaccSheet(t.dataset.item);
  else if(a==='vaccedit')openVaccSheet(null,t.dataset.id);
  else if(a==='vaccset')openVaccSettings();
  else if(a==='libedit')openLibItem(t.dataset.name||null);
  else if(a==='grpedit')openGroup(t.dataset.id||null);
  else if(a==='wormadd')openWormBackfill();
  else if(a==='alertgo'){S.sel=t.dataset.pid;lsSet('petnote.sel',S.sel);S.tab=t.dataset.tab;$('#main').scrollTop=0;render()}
  else if(a==='notifask'){Notif.ask().then(function(){Notif.sync();updateNotifCard()})}
  else if(a==='notiftest'){Notif.test().then(function(ok){toast(ok?'5 秒後會收到測試通知':'無法傳送測試通知')})}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('label[for=importFile]')){e.preventDefault();var fi=$('#importFile');if(fi)fi.click();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.entry[data-act]')){e.preventDefault();openLogSheet(e.target.dataset.id)}
  if(e.key==='Escape'&&Layers.length)closeTop();
});
var qTimer=null;
document.addEventListener('input',function(e){
  if(e.target.id!=='tl-q')return;
  var v=e.target.value;clearTimeout(qTimer);
  qTimer=setTimeout(function(){S.q=v;S.filter='all';S.tlLimit=30;S.tlPage=1;refreshTl()},180);

document.addEventListener('change',function(e){
  if(e.target.type==='file')pickingFile=0;
  if(e.target.id==='importFile'){var f=e.target.files&&e.target.files[0];if(f)importData(f);e.target.value=''}

document.addEventListener('click',function(e){

document.addEventListener('click',function(e){if(e.target.closest('label[for=importFile],input[type=file],[data-add],#pf-av'))pickingFile=Date.now()},true);
document.addEventListener('visibilitychange',function(){
  if(document.hidden||Layers.length||Busy.el)return;

function applyTheme(){
  var v=lsGet('petnote.theme'),r=document.documentElement;
  if(v==='light'||v==='dark')r.setAttribute('data-theme',v);else if(v==='system')r.removeAttribute('data-theme');
}

/* ================= 啟動 ================= */
(async function init(){
  applyTheme();
  await DB.open();
  S.pets=(await DB.all('pets')).sort(function(a,b){return a.created-b.created});
  S.logs=await DB.all('logs');S.worms=await DB.all('worms');S.vaccs=await DB.all('vaccines');
  var metas=await DB.all('meta');
  var meta=metas.filter(function(m){return m.id==='vaccLib'})[0],gmeta=metas.filter(function(m){return m.id==='vaccGroups'})[0];
  if(meta&&Array.isArray(meta.items)){
    S.lib=meta.items;
    if(gmeta&&Array.isArray(gmeta.items))S.groups=gmeta.items;else autoGroup();
  }else{S.lib=JSON.parse(JSON.stringify(DEFAULT_LIB));S.groups=JSON.parse(JSON.stringify(DEFAULT_GROUPS));libDirty=true}
  S.pets.forEach(ensurePet);
  if(libDirty)await saveLib();
  for(var mi=0;mi<S.pets.length;mi++){if(S.pets[mi]._mig)await savePet(S.pets[mi])}
  var s=lsGet('petnote.sel');S.sel=(S.pets.filter(function(p){return p.id===s})[0]||S.pets[0]||{}).id||null;
  if(S.logs.some(function(l){return (l.photos||[]).some(function(p){return !Photos.isId(p)})})){S.tab='timeline';await migratePhotos();S.tab='home'}
  render();Notif.sync();
  setTimeout(function(){Updater.check(false)},2500);
  if(!DB.ok)toast('目前無法永久儲存資料');
  else{var lv=lsGet('petnote.ver');if(lv&&lv!==APP_VERSION)toast('已更新到 '+APP_VERSION+' 版，資料都還在');lsSet('petnote.ver',APP_VERSION)}
  try{
    var cap=window.Capacitor,native=cap&&cap.isNativePlatform&&cap.isNativePlatform();
    if(!native&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
    if(!native&&navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(function(p){if(!p)return navigator.storage.persist()}).catch(function(){});
  }catch(e){}
})();
})();
