<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E7E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="寵物筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>寵物筆記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：單欄手機 App。上方寵物切換、中間內容、下方四個分頁。招牌元素是驅蟲「集章」格，像寵物健康手冊蓋章。 */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E3EBE8; --ink:#14262B; --ink2:#52666B; --line:#D2DDDA;
  --primary:#0F6E7E; --on-primary:#FFFFFF; --primary-soft:#D5EBEE;
  --accent:#D9691F; --accent-soft:#FBE5D2;
  --ok:#277D50; --ok-soft:#D6EFE1; --bad:#B93B35; --bad-soft:#F8DCD9;
  --shadow:0 1px 2px rgba(20,38,43,.06),0 6px 18px rgba(20,38,43,.06);
  --scrim:rgba(10,20,22,.5);
  --ts:55%; --tl:34%; --bs:62%; --bl:91%;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --navpad:0px;
  --font:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162226; --surface2:#1F2F34; --ink:#E4EEEC; --ink2:#9BB0B3; --line:#2B3E43;
    --primary:#5CC1D0; --on-primary:#06262B; --primary-soft:#173B41;
    --accent:#F29A5B; --accent-soft:#41291A;
    --ok:#5CCB93; --ok-soft:#173528; --bad:#F27D75; --bad-soft:#401E1C;
    --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
    --ts:68%; --tl:74%; --bs:32%; --bl:21%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162226; --surface2:#1F2F34; --ink:#E4EEEC; --ink2:#9BB0B3; --line:#2B3E43;
  --primary:#5CC1D0; --on-primary:#06262B; --primary-soft:#173B41;
  --accent:#F29A5B; --accent-soft:#41291A;
  --ok:#5CCB93; --ok-soft:#173528; --bad:#F27D75; --bad-soft:#401E1C;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  --ts:68%; --tl:74%; --bs:32%; --bl:21%;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:block;flex:none}
b{font-weight:700}
small{font-size:12.5px;color:var(--ink2)}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
#top{flex:none;padding-top:10px;padding-bottom:6px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--primary)}
.today{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 8px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;max-width:60vw}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.pchip.add{padding:0;width:44px;justify-content:center;color:var(--primary);border-style:dashed}

.mainwrap{position:relative;flex:1;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-top:6px;padding-bottom:96px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.linkbtn{color:var(--primary);font-weight:600;font-size:14px;min-height:36px;padding:0 4px;display:flex;align-items:center;gap:2px}

.av{width:var(--s,48px);height:var(--s,48px);border-radius:30%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s,48px)*.42);color:hsl(var(--h,200) var(--ts) var(--tl));background:hsl(var(--h,200) var(--bs) var(--bl))}
.pchip .av{border-radius:50%}

.pet{border-radius:24px;padding:18px}
.pet-top{display:flex;gap:14px;align-items:center}
.pet-top .grow{flex:1;min-width:0}
.pet h1{margin:0;font-size:25px;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.pet .meta{color:var(--ink2);font-size:14px;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);background:var(--surface2);flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 0;border-top:1px dashed var(--line)}
.facts div{padding:10px 0 0}
.facts div+div{padding-left:14px;border-left:1px dashed var(--line)}
.facts dt{font-size:12.5px;color:var(--ink2)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.age{margin-top:14px;padding:14px;border-radius:14px;background:var(--primary-soft)}
.age-nums{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.age-nums span{font-size:15px;color:var(--primary)}
.age-nums b{font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-right:3px}
.age .sub{margin-top:6px;font-size:13.5px;color:var(--ink2)}
.age .party{margin-top:8px;display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent);color:var(--surface);font-weight:700;font-size:13.5px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}

.annbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.annbig b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.02em}
.annbig span{color:var(--ink2);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.todaybanner{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:var(--accent);color:var(--surface);font-weight:700}
.evlist{list-style:none;margin:10px 0 0;padding:0}
.evlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.evlist .when{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.evlist .nm{font-weight:600}
.evlist small{display:block}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.cnt{background:var(--primary-soft);color:var(--primary)}

.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cardhead+.wrow{border-top:0;padding-top:0}
.wrow .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mini{min-height:36px;padding:0 14px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px}

.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;color:hsl(var(--h,200) var(--ts) var(--tl));background:hsl(var(--h,200) var(--bs) var(--bl))}
.recent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.recent:first-of-type{border-top:0;padding-top:0}
.recent .tx{flex:1;min-width:0}
.recent .tx p{margin:2px 0 0;color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recent time{font-size:12.5px;color:var(--ink2);white-space:nowrap}

.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.pagehead h2{margin:0;font-size:22px;font-weight:800}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 14px 0;padding-right:max(16px,env(safe-area-inset-right,0px))}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dayh{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.dayh:first-child{margin-top:0}
.dayh small{font-weight:600}
.entry{position:relative;display:flex;gap:12px;padding-bottom:12px;width:100%;text-align:left}
.entry .rail{flex:none;width:14px;position:relative;display:flex;justify-content:center}
.entry .rail::before{content:"";position:absolute;top:18px;bottom:-12px;width:2px;background:var(--line)}
.entry:last-child .rail::before{display:none}
.entry .dot{position:relative;margin-top:8px;width:12px;height:12px;border-radius:50%;background:hsl(var(--h,200) var(--ts) var(--tl));box-shadow:0 0 0 3px var(--bg)}
.ebody{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ehead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ehead time{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.note{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.thumbs button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);min-width:0}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--primary);color:var(--on-primary);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;padding:36px 12px;color:var(--ink2)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty p{margin:0 0 16px}
.empty .btn{margin:4px}

.yearnav{display:flex;align-items:center;gap:4px}
.yearnav b{min-width:64px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.yearnav button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2)}
.remindline{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--ink2);font-size:14px}
.remindline span{flex:1;min-width:0}
.stampcard h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stamp{aspect-ratio:1;min-width:0;border-radius:50%;border:1.5px solid var(--line);color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:13px;font-weight:600;background:var(--bg);font-variant-numeric:tabular-nums}
.stamp small{font-size:10.5px;color:inherit;opacity:.9}
.stamp.future{opacity:.55}
.stamp.now{border-color:var(--primary);color:var(--primary);border-width:2px}
.stamp.plan{border:2px dashed var(--accent);color:var(--accent)}
.stamp.done{border:0;color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 5px var(--accent-soft),inset 0 0 0 6px var(--accent);transform:rotate(var(--rot,0deg));font-weight:800}
.stamp.done{font-size:12.5px}
.stamp.done small{font-weight:700;font-size:10px}

.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:first-child{border-top:0}
.lrow .grow{flex:1;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.seg button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.sechead{margin:22px 2px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.sechead:first-child{margin-top:4px}
.about{font-size:13px;color:var(--ink2);line-height:1.7;padding:4px 2px}

nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--navpad)}
nav.tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink2)}
nav.tabs .ico{width:46px;height:30px;border-radius:15px;display:grid;place-items:center}
nav.tabs button.on{color:var(--primary)}
nav.tabs button.on .ico{background:var(--primary-soft)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-weight:600;width:100%;text-align:left;line-height:1.35}
.alert span{flex:1;min-width:0;overflow-wrap:anywhere}
.alert svg{color:var(--accent)}
.alert.bad{background:var(--bad-soft)}
.alert.bad svg{color:var(--bad)}
.vnext{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vnext span{color:var(--ink2);font-size:14px}
.vnext b{font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hist{margin-top:12px;border-top:1px dashed var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hist .hrow:first-child,.yrh+.hrow{border-top:0}
.hrow .d{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.hrow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.hrow svg{color:var(--ink2)}
.yrh{margin:12px 0 2px;font-size:13px;font-weight:700;color:var(--ink2)}
.yrh:first-of-type{margin-top:0}
.itemcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.itemcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.itemcard .top b{min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:transparent;transition:background .2s}
.layer.open{background:var(--scrim)}
.layer.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:560px;max-height:calc(100% - var(--sat) - 12px);display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
.layer.open .sheet{transform:none}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;padding-bottom:8px}
.sheet-h h3{margin:0;font-size:18px;font-weight:800;overflow-wrap:anywhere}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding-top:6px;padding-bottom:18px;overscroll-behavior:contain}
.sheet-f{flex:none;display:flex;gap:10px;padding-top:10px;padding-bottom:14px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:none}
.dlg{width:100%;max-width:360px;background:var(--surface);border-radius:20px;padding:20px;transform:scale(.94);opacity:0;transition:transform .18s,opacity .18s}
.layer.open .dlg{transform:none;opacity:1}
.dlg p{margin:0 0 16px;font-size:16px;overflow-wrap:anywhere}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1}
.viewer{background:#000}
.layer.viewer.open{background:#000}
.vimg{position:absolute;inset:0;display:grid;place-items:center}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding-top:calc(var(--sat) + 10px);color:#fff;font-variant-numeric:tabular-nums}
.vbar button,.vnav button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.vnav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding-bottom:calc(var(--sab) + 18px)}

.field{margin-bottom:14px;min-width:0}
.field>label,.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
input[type=text],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-width:0;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);appearance:none;-webkit-appearance:none}
textarea{min-height:104px;resize:vertical;line-height:1.5}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px}
.av-pick{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.av-btn{position:relative}
.av-cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;border:3px solid var(--surface)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.swrow>span:first-child{min-width:0}
.swrow b{display:block}
.sw{position:relative;flex:none;width:52px;height:32px}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--primary)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.typegrid{display:flex;flex-wrap:wrap;gap:8px}
.typegrid button{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.typegrid button.on{border-color:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--ts) var(--tl));background:hsl(var(--h) var(--bs) var(--bl))}
.vchips{display:flex;flex-wrap:wrap;gap:8px}

(function(){

/* ================= 基本工具 ================= */

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var addMonths=function(d,n){var t=new Date(d.getFullYear(),d.getMonth()+n,1);var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d.getDate(),last));return t};
var monthAdd=function(m,n){var a=m.split('-').map(Number);return ym(new Date(a[0],a[1]-1+n,1))};

var toLocalInput=function(ts){var d=new Date(ts);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
var hhmm=function(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};

/* ================= 日期計算 ================= */
function ageParts(b,now){
  if(b>now) return null;
  var total=(now.getFullYear()-b.getFullYear())*12+now.getMonth()-b.getMonth();
  if(addMonths(b,total)>now) total--;
  var base=addMonths(b,total);
  return {y:Math.floor(total/12),m:total%12,d:dayDiff(now,base)};
}
function nextAnn(d,now){
  var y=Math.max(now.getFullYear(),d.getFullYear()+1);
  for(var i=0;i<3;i++,y++){
    var last=new Date(y,d.getMonth()+1,0).getDate();
    var dt=new Date(y,d.getMonth(),Math.min(d.getDate(),last));
    if(dt>=now) return {date:dt,years:y-d.getFullYear()};
  }
  return null;
}
function annEvents(home,now){
  var ev=[],n=nextAnn(home,now);
  if(n){
    ev.push({label:'來家 '+n.years+' 週年',date:n.date});
    var d2=new Date(n.date.getFullYear()+1,home.getMonth(),home.getDate());
    ev.push({label:'來家 '+(n.years+1)+' 週年',date:d2});
  }
  [100,200,300,500,1000,1500,2000,2500,3000,4000,5000].forEach(function(k){
    var d=addDays(home,k-1); if(d>=now) ev.push({label:'來家第 '+k+' 天',date:d});
  });
  ev.sort(function(a,b){return a.date-b.date});
  return ev.slice(0,3);
}
function relDays(date,now){
  var n=dayDiff(date,now);
  return n===0?'就是今天':(n+' 天後');
}

/* ================= 資料層 (IndexedDB) ================= */
var DB={db:null,ok:false,
  open:function(){return new Promise(function(res){
    try{
      var r=indexedDB.open('petnote',3);
      r.onupgradeneeded=function(){var d=r.result;['pets','logs','worms','vaccines','meta'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
      r.onsuccess=function(){DB.db=r.result;DB.ok=true;res(true)};
      r.onerror=function(){res(false)};r.onblocked=function(){res(false)};
    }catch(e){res(false)}
  })},
  all:function(n){return new Promise(function(res){
    if(!DB.ok) return res([]);
    try{var q=DB.db.transaction(n).objectStore(n).getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}
  })},
  put:function(n,o){return new Promise(function(res){
    if(!DB.ok) return res(false);
    try{var t=DB.db.transaction(n,'readwrite');t.objectStore(n).put(o);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)};t.onabort=function(){res(false)}}catch(e){res(false)}
  })},
  del:function(n,id){return new Promise(function(res){
    if(!DB.ok) return res(false);
    try{var t=DB.db.transaction(n,'readwrite');t.objectStore(n).delete(id);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)}}catch(e){res(false)}
  })}
};

}

var DEFAULT_LIB=[
  {name:'貓三合一疫苗',every:12,remind:14},{name:'貓五合一疫苗',every:12,remind:14},{name:'貓白血病疫苗',every:12,remind:14},
  {name:'狗八合一疫苗',every:12,remind:14},{name:'狗十合一疫苗',every:12,remind:14},{name:'狂犬病疫苗',every:12,remind:14}
];
var SPECIES_DEFAULT={'貓':['貓三合一疫苗','狂犬病疫苗'],'狗':['狗八合一疫苗','狂犬病疫苗'],'其他':['狂犬病疫苗']};
var libDirty=false;
function libGet(n){return S.lib.filter(function(x){return x.name===n})[0]||null}
function libAdd(n,every,remind){if(!n||libGet(n))return;S.lib.push({name:n,every:every||12,remind:(remind==null?14:remind)});libDirty=true}
function speciesDefault(sp){return (SPECIES_DEFAULT[sp]||SPECIES_DEFAULT['其他']).filter(function(n){return !!libGet(n)})}
function vItems(p){return (p.vaccItems||[]).map(libGet).filter(Boolean)}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function ensurePet(p){
  if(!Array.isArray(p.vaccItems)){p.vaccItems=speciesDefault(p.species);p._mig=true}
  else if(p.vaccItems.some(function(it){return typeof it!=='string'})){
    p.vaccItems=uniq(p.vaccItems.map(function(it){if(typeof it==='string')return it;libAdd(it.name,it.every,it.remind);return it.name}).filter(Boolean));p._mig=true;
  }
  if(!Array.isArray(p.wormItems))p.wormItems=[];
  return p;
}
async function saveLib(){libDirty=false;saved(await DB.put('meta',{id:'vaccLib',items:S.lib}));Notif.sync()}
function upsert(arr,o){var i=arr.findIndex(function(x){return x.id===o.id});if(i<0)arr.push(o);else arr[i]=o}
async function savePet(p){delete p._mig;upsert(S.pets,p);S.pets.sort(function(a,b){return a.created-b.created});saved(await DB.put('pets',p));Notif.sync()}

/* ================= 圖片 ================= */
function readImage(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function hueOf(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function avatar(p,size){
  if(p.photo) return '<img class="av" style="--s:'+size+'px" src="'+p.photo+'" alt="">';
  var ch=(p.name||'?').trim().charAt(0)||'?';
  return '<span class="av" style="--s:'+size+'px;--h:'+hueOf(p.name||'?')+'">'+esc(ch)+'</span>';
}

/* ================= 層（底部面板、對話框）與返回鍵 ================= */
var Layers=[];
function pushLayer(el,onClose){
  document.body.appendChild(el);
  var hist=true;try{history.pushState({layer:Layers.length+1},'')}catch(e){hist=false}
  var L={el:el,hist:hist,onClose:onClose};Layers.push(L);
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('open')})});
  return L;
}
function removeTop(){
  var L=Layers.pop();if(!L)return;
  L.el.classList.remove('open');setTimeout(function(){L.el.remove()},240);
  if(L.onClose)L.onClose();
}
function closeTop(){
  var n=Layers.length;if(!n)return;var L=Layers[n-1];
  if(L.hist){history.back();setTimeout(function(){if(Layers.length===n&&Layers[n-1]===L)removeTop()},400)}
  else removeTop();
}
window.addEventListener('popstate',function(){if(Layers.length)removeTop()});

function openSheet(o){
  var el=document.createElement('div');el.className='layer';
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'">'+
    '<div class="sheet-h gut"><h3>'+esc(o.title)+'</h3><button class="iconbtn" data-close aria-label="關閉">'+ico('x')+'</button></div>'+
    '<div class="sheet-b gut">'+o.body+'</div>'+(o.footer?'<div class="sheet-f gut">'+o.footer+'</div>':'')+'</div>';
  el.addEventListener('mousedown',function(e){if(e.target===el)closeTop()});
  el.addEventListener('click',function(e){if(e.target.closest('[data-close]'))closeTop()});
  pushLayer(el);
  if(o.onMount)o.onMount(el);
  return el;
}
function confirmDlg(msg,okLabel,danger){
  return new Promise(function(res){
    var el=document.createElement('div');el.className='layer center';
    el.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="row"><button class="btn" data-no>取消</button><button class="btn '+(danger?'danger':'primary')+'" data-yes>'+esc(okLabel||'確定')+'</button></div></div>';
    var done=false;
    function fin(v){if(done)return;done=true;res(v)}
    el.addEventListener('click',function(e){
      if(e.target.closest('[data-yes]')){fin(true);closeTop()}
      else if(e.target.closest('[data-no]')||e.target===el){closeTop()}
    });
    pushLayer(el,function(){fin(false)});
  });
}
var toastT=null;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2300);
}
function bindSeg(root,cb){
  root.addEventListener('click',function(e){
    var b=e.target.closest('button[data-v]');if(!b||!root.contains(b))return;
    $$('button',root).forEach(function(x){x.classList.toggle('on',x===b)});
    if(cb)cb(b.dataset.v);
  });
}
var segVal=function(root){var b=$('button.on',root);return b?b.dataset.v:''};

/* ================= 驅蟲狀態 ================= */
function itemStatus(pet,item,cm){
  var done=S.worms.filter(function(w){return w.id===wid(pet.id,cm,item.name)})[0];
  if(done) return {state:'done',rec:done};
  var prev=S.worms.filter(function(w){return w.petId===pet.id&&w.item===item.name&&w.month<cm}).sort(function(a,b){return a.month<b.month?1:-1})[0];
  if(!prev) return {state:'due'};
  if(monthsBetween(prev.month,cm)>=item.every) return {state:'due',last:prev};
  return {state:'wait',next:monthAdd(prev.month,item.every),last:prev};
}
function planMonth(pet,item,cm){
  var last=S.worms.filter(function(w){return w.petId===pet.id&&w.item===item.name}).sort(function(a,b){return a.month<b.month?1:-1})[0];
  if(!last) return cm;
  var nx=monthAdd(last.month,item.every);
  return nx<cm?cm:nx;
}

/* ================= 預防針 ================= */
var EVERY_OPTS=[3,6,12,24,36],REMIND_OPTS=[-1,0,1,3,7,14,30];
function everyLabel(n){return n===12?'每年':(n%12===0?'每 '+(n/12)+' 年':(n===1?'每月':'每 '+n+' 個月'))}
function remindLabel(r){return r<0?'不提醒':(r===0?'到期當天提醒':'提前 '+r+' 天提醒')}
function optList(list,val,fn){
  var l=list.indexOf(val)<0?list.concat([val]).sort(function(a,b){return a-b}):list;
  return l.map(function(n){return '<option value="'+n+'" '+(n===val?'selected':'')+'>'+fn(n)+'</option>'}).join('');
}
function vaccStatus(p,it,now){
  var recs=S.vaccs.filter(function(v){return v.petId===p.id&&v.item===it.name}).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0)});
  if(!recs.length)return {state:'none',recs:recs};
  var last=recs[0],due=addMonths(parseD(last.date),it.every),days=dayDiff(due,now);
  var state=days<0?'overdue':((it.remind>=0&&days<=it.remind)?'soon':'ok');
  return {state:state,last:last,due:due,days:days,recs:recs};
}
function vaccChip(st,it){
  if(st.state==='none')return '<span class="pill">尚無紀錄</span>';
  var txt=st.days<0?'已逾期 '+(-st.days)+' 天':(st.days===0?'今天到期':'還有 '+st.days+' 天');
  var warn=it.remind>=0&&(st.state==='overdue'||st.state==='soon');
  return '<span class="pill '+(warn?'warn':'')+'">'+txt+'</span>';
}
function alertsAll(now){
  var out=[];
  S.pets.forEach(function(p){
    vItems(p).forEach(function(it){
      if(it.remind<0)return;
      var st=vaccStatus(p,it,now);if(st.state!=='soon'&&st.state!=='overdue')return;
      out.push({tone:st.state==='overdue'?'bad':'warn',pid:p.id,tab:'vaccine',text:p.name+'・'+it.name+' '+(st.days<0?'已逾期 '+(-st.days)+' 天':(st.days===0?'今天到期':st.days+' 天後到期'))});
    });
    if(p.wormRemind&&now.getDate()>=p.wormDay){
      var cm=ym(now),names=(p.wormItems||[]).filter(function(it){return itemStatus(p,it,cm).state==='due'}).map(function(it){return it.name});
      if(names.length)out.push({tone:'warn',pid:p.id,tab:'deworm',text:p.name+'・本月驅蟲待辦：'+names.join('、')});
    }
  });
  return out;
}
function alertsHtml(now){
  var al=alertsAll(now);if(!al.length)return '';
  al.sort(function(a,b){return (a.tone==='bad'?0:1)-(b.tone==='bad'?0:1)});
  return '<div class="alerts">'+al.slice(0,4).map(function(a){return '<button class="alert '+a.tone+'" data-act="alertgo" data-pid="'+a.pid+'" data-tab="'+a.tab+'">'+ico('bell',20)+'<span>'+esc(a.text)+'</span>'+ico('cr',16)+'</button>'}).join('')+'</div>';
}
function vaccSummary(p,now){
  var h='<section class="card"><div class="cardhead"><h2>預防針</h2><button class="linkbtn" data-act="tab" data-tab="vaccine">全部紀錄'+ico('cr',16)+'</button></div>';

    h+='<section class="card"><div class="cardhead"><h2>'+esc(it.name)+'</h2>'+chip+'</div>'+next+rows+(it.orphan?'':'<button class="btn block" style="margin-top:14px" data-act="vaccadd" data-item="'+esc(it.name)+'">'+ico('plus',20)+'記錄這劑</button>')+'</section>';
  });
  return h+'<small style="padding:0 4px">下次日期＝最近一次施打日期＋間隔。疫苗名稱、間隔與提醒在「設定 → 疫苗清單」修改。實際施打時間請依獸醫師建議。</small></div>';
}

/* ================= 表單：驅蟲 ================= */
function openWormSheet(itemName,month){
  var p=curPet();if(!p)return;
  var id=wid(p.id,month,itemName),ex=S.worms.filter(function(w){return w.id===id})[0];
  var parts=month.split('-').map(Number),now=today(),first=month+'-01',last=month+'-'+pad(new Date(parts[0],parts[1],0).getDate());
  var def=ex?ex.date:(month===ym(now)?ymd(now):(month<ym(now)?month+'-'+pad(Math.min(p.wormDay||1,28)):first));
  var body='<div class="field"><label for="wf-date">驅蟲日期</label><input id="wf-date" type="date" min="'+first+'" max="'+last+'" value="'+def+'"></div>'+
    '<div class="field"><label for="wf-note">藥品／備註（選填）</label><input id="wf-note" type="text" maxlength="40" placeholder="例如：福來恩、大寶貝" value="'+esc(ex?ex.note:'')+'"></div>';
  var footer=(ex?'<button class="btn danger" id="wf-del">取消打卡</button>':'')+'<button class="btn primary" id="wf-save">'+(ex?'儲存':'完成打卡')+'</button>';
  openSheet({title:itemName+'・'+parts[0]+'年'+parts[1]+'月',body:body,footer:footer,onMount:function(el){
    $('#wf-save',el).onclick=async function(){
      var d=$('#wf-date',el).value;
      if(!d||d<first||d>last){toast('日期要在 '+parts[1]+' 月內');return}
      await saveWorm({id:id,petId:p.id,month:month,item:itemName,date:d,note:$('#wf-note',el).value.trim()});
      closeTop();render();toast('已蓋章');
    };
    var del=$('#wf-del',el);
    if(del)del.onclick=async function(){await removeWorm(id);closeTop();render();toast('已取消打卡')};
  }});
}
function openWormSettings(){

/* ================= 表單：預防針／補登驅蟲 ================= */
function vchipHtml(names,sel,multi){
  return names.map(function(n){
    var on=sel.indexOf(n)>=0;
    return '<button type="button" class="'+(on?'on':'')+'" data-v="'+esc(n)+'" aria-pressed="'+on+'">'+(multi?'<span class="chk">'+(on?'✓':'')+'</span>':'')+esc(n)+'</button>';
  }).join('')+'<button type="button" class="new" data-new>'+ico('plus',16)+'新增疫苗</button>';
}
function openVaccSheet(itemName,id){
  var p=curPet();if(!p)return;
  var ex=id&&S.vaccs.filter(function(v){return v.id===id})[0];
  var multi=!ex;
  var sel=ex?[ex.item]:(itemName?[itemName]:[]);
  function names(){
    var t=(p.vaccItems||[]).slice();
    var all=t.concat(S.lib.map(function(l){return l.name}).filter(function(n){return t.indexOf(n)<0}));
    sel.forEach(function(n){if(all.indexOf(n)<0)all.push(n)});
    return all;
  }
  var body='<div class="field"><span class="lbl">'+(multi?'打了哪些針（可複選）':'疫苗')+'</span><div class="vchips" id="vf-items"></div>'+(multi?'<div class="hint">同一天打好幾劑，可以一次勾選。這隻寵物沒追蹤的疫苗，記錄後會自動加入追蹤。</div>':'')+'</div>'+
    '<div class="field"><label for="vf-date">施打日期</label><input id="vf-date" type="date" max="'+ymd(today())+'" value="'+(ex?ex.date:ymd(today()))+'"><div class="hint">補登以前打過的針，選當時的日期就可以。下次日期會依最近一次自動計算。</div></div>'+
    '<div class="field"><label for="vf-note">診所／疫苗品牌（選填）</label><input id="vf-note" type="text" maxlength="40" placeholder="例如：○○動物醫院" value="'+esc(ex?ex.note:'')+'"></div>';
  var footer=(ex?'<button class="btn danger" id="vf-del">刪除</button>':'')+'<button class="btn primary" id="vf-save">'+(ex?'儲存':'新增紀錄')+'</button>';
  openSheet({title:(ex?'編輯':'新增')+'施打紀錄・'+p.name,body:body,footer:footer,onMount:function(el){
    var box=$('#vf-items',el);
    function paint(){box.innerHTML=vchipHtml(names(),sel,multi)}
    paint();
    box.addEventListener('click',function(e){
      if(e.target.closest('[data-new]')){openLibItem(null,function(n){if(multi){if(sel.indexOf(n)<0)sel.push(n)}else sel=[n];paint()});return}
      var b=e.target.closest('button[data-v]');if(!b)return;
      var n=b.dataset.v,i=sel.indexOf(n);
      if(multi){if(i>=0)sel.splice(i,1);else sel.push(n)}else sel=[n];
      paint();
    });
    $('#vf-save',el).onclick=async function(){
      var d=$('#vf-date',el).value,note=$('#vf-note',el).value.trim();
      if(!sel.length){toast('請點選打了哪一種疫苗');return}
      if(!d){toast('請選擇施打日期');return}
      if(d>ymd(today())){toast('施打日期不能晚於今天');return}
      if(ex)await saveVacc({id:ex.id,petId:p.id,item:sel[0],date:d,note:note});
      else for(var i=0;i<sel.length;i++)await saveVacc({id:uid(),petId:p.id,item:sel[i],date:d,note:note});
      var add=sel.filter(function(n){return libGet(n)&&(p.vaccItems||[]).indexOf(n)<0});
      if(add.length){p.vaccItems=S.lib.map(function(l){return l.name}).filter(function(n){return p.vaccItems.indexOf(n)>=0||add.indexOf(n)>=0});await savePet(p)}
      closeTop();render();toast(ex?'已儲存':(sel.length>1?'已新增 '+sel.length+' 筆紀錄':'已新增，下次日期已更新'));Notif.ensure();
    };
    var del=$('#vf-del',el);
    if(del)del.onclick=async function(){
      var ok=await confirmDlg('刪除這筆施打紀錄？','刪除',true);if(!ok)return;
      await removeVacc(ex.id);closeTop();render();toast('已刪除');
    };
  }});
}

    '<div class="hint">疫苗名稱、間隔與提醒，在「設定 → 疫苗清單」修改，所有寵物共用。取消追蹤不會刪除已記錄的施打日期。</div>';
  openSheet({title:'追蹤項目・'+p.name,body:body,footer:'<button class="btn primary" id="vt-save">儲存</button>',onMount:function(el){
    var list=$('#vt-list',el);
    function paint(){
      list.innerHTML=S.lib.map(function(l,i){
        return '<div class="swrow"'+(i===0?' style="border-top:0"':'')+'><span><b>'+esc(l.name)+'</b><small>'+everyLabel(l.every)+'・'+remindLabel(l.remind)+'</small></span><span class="sw"><input type="checkbox" data-n="'+esc(l.name)+'" '+(on.indexOf(l.name)>=0?'checked':'')+' aria-label="追蹤 '+esc(l.name)+'"><i></i></span></div>';
      }).join('')||'<small>疫苗清單是空的，先新增一種疫苗。</small>';
    }
    paint();
    list.addEventListener('change',function(e){var c=e.target.closest('input[data-n]');if(!c)return;var n=c.dataset.n,i=on.indexOf(n);if(c.checked&&i<0)on.push(n);if(!c.checked&&i>=0)on.splice(i,1)});
    $('#vt-new',el).onclick=function(){openLibItem(null,function(n){if(on.indexOf(n)<0)on.push(n);paint()})};
    $('#vt-save',el).onclick=async function(){
      p.vaccItems=S.lib.map(function(l){return l.name}).filter(function(n){return on.indexOf(n)>=0});
      await savePet(p);closeTop();render();toast('已儲存');Notif.ensure();
    };
  }});
}
function openLibItem(name,onSaved){
  var ex=name?libGet(name):null;
  var it=ex?{name:ex.name,every:ex.every,remind:ex.remind}:{name:'',every:12,remind:14};
  var used=ex?S.vaccs.filter(function(v){return v.item===ex.name}).length:0;
  var body='<div class="field"><label for="lb-name">疫苗名稱</label><input id="lb-name" type="text" maxlength="20" autocomplete="off" placeholder="例如：貓五合一疫苗、FIP 預防" value="'+esc(it.name)+'">'+(ex&&used?'<div class="hint">改名後，已記錄的 '+used+' 筆施打紀錄會一起改名。改成清單裡已有的名稱，會把兩個項目合併。</div>':'')+'</div>'+
    '<div class="two"><div class="field"><label for="lb-every">多久施打一次</label><select id="lb-every">'+optList(EVERY_OPTS,it.every,everyLabel)+'</select></div>'+
    '<div class="field"><label for="lb-remind">提醒</label><select id="lb-remind">'+optList(REMIND_OPTS,it.remind,remindLabel)+'</select></div></div>'+
    '<div class="hint">間隔請依獸醫師建議設定。選「不提醒」就不會跳出提醒。這些設定所有寵物共用。</div>';
  var footer=(ex?'<button class="btn danger" id="lb-del">刪除</button>':'')+'<button class="btn primary" id="lb-save">'+(ex?'儲存':'加入清單')+'</button>';
  openSheet({title:ex?'編輯疫苗':'新增疫苗',body:body,footer:footer,onMount:function(el){
    $('#lb-save',el).onclick=async function(){
      var nm=$('#lb-name',el).value.trim().replace(/\s+/g,' '),ev=+$('#lb-every',el).value,rm=+$('#lb-remind',el).value;
      if(!nm){toast('請輸入疫苗名稱');$('#lb-name',el).focus();return}
      var other=libGet(nm);
      if(!ex){
        if(other){toast('清單裡已經有「'+nm+'」');return}
        S.lib.push({name:nm,every:ev,remind:rm});await saveLib();
      }else if(nm===ex.name){
        ex.every=ev;ex.remind=rm;await saveLib();
      }else{
        if(other&&other!==ex){
          var ok=await confirmDlg('清單裡已經有「'+nm+'」。要把「'+ex.name+'」的紀錄合併過去嗎？','合併');if(!ok)return;
          other.every=ev;other.remind=rm;S.lib=S.lib.filter(function(l){return l!==ex});
        }else{ex.name=nm;ex.every=ev;ex.remind=rm}
        var old=name,recs=S.vaccs.filter(function(v){return v.item===old});
        for(var i=0;i<recs.length;i++){recs[i].item=nm;await saveVacc(recs[i])}
        for(var j=0;j<S.pets.length;j++){var p=S.pets[j];if((p.vaccItems||[]).indexOf(old)>=0){p.vaccItems=uniq(p.vaccItems.map(function(n){return n===old?nm:n}));await savePet(p)}}
        await saveLib();
      }
      closeTop();render();toast(ex?'已儲存':'已加入清單');
      if(onSaved)onSaved(nm);
    };
    var del=$('#lb-del',el);
    if(del)del.onclick=async function(){
      var ok=await confirmDlg('從清單刪除「'+ex.name+'」？所有寵物都會停止追蹤這個疫苗。'+(used?'已記錄的 '+used+' 筆施打日期會保留，仍可在預防針頁回看。':''),'刪除',true);
      if(!ok)return;
      S.lib=S.lib.filter(function(l){return l!==ex});
      for(var j=0;j<S.pets.length;j++){var p=S.pets[j];if((p.vaccItems||[]).indexOf(ex.name)>=0){p.vaccItems=p.vaccItems.filter(function(n){return n!==ex.name});await savePet(p)}}
      await saveLib();closeTop();render();toast('已刪除');
    };
  }});
}
function openWormBackfill(){
  var p=curPet();if(!p)return;
  if(!p.wormItems.length){toast('請先設定驅蟲項目');openWormSettings();return}
  var opts=p.wormItems.map(function(i){return '<option value="'+esc(i.name)+'">'+esc(i.name)+'</option>'}).join('');
  var body='<div class="field"><label for="bf-item">驅蟲項目</label><select id="bf-item">'+opts+'</select></div>'+
    '<div class="field"><label for="bf-date">驅蟲日期</label><input id="bf-date" type="date" max="'+ymd(today())+'" value="'+ymd(today())+'"><div class="hint">補登以前驅蟲的日期。每個項目每月記錄一筆，同一個月再補登會更新那一筆。</div></div>'+
    '<div class="field"><label for="bf-note">藥品／備註（選填）</label><input id="bf-note" type="text" maxlength="40" placeholder="例如：福來恩"></div>';
  openSheet({title:'補登驅蟲紀錄',body:body,footer:'<button class="btn primary" id="bf-save">補登</button>',onMount:function(el){
    $('#bf-save',el).onclick=async function(){

      await saveWorm({id:id,petId:p.id,month:mo,item:item,date:d,note:$('#bf-note',el).value.trim()});
      S.year=+d.slice(0,4);closeTop();render();toast(existed?'已更新該月紀錄':'已補登');

/* ================= 備份 ================= */
async function exportData(){
  var data={app:'petnote',version:3,exported:new Date().toISOString(),vaccLib:S.lib,pets:S.pets,logs:S.logs,worms:S.worms,vaccines:S.vaccs};
  var text=JSON.stringify(data),name='寵物筆記備份-'+ymd(new Date())+'.json';
  var cap=window.Capacitor,P=cap&&cap.Plugins;
  try{
    if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&P&&P.Filesystem&&P.Share){
      var r=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:name,url:r.uri,dialogTitle:'儲存或分享備份檔'});return;
    }
  }catch(e){ if(e&&/cancel/i.test(String(e.message||e)))return; }
  try{
    var file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){ if(e&&e.name==='AbortError')return; }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast('已產生備份檔');
}
async function importData(file){
  try{
    var d=JSON.parse(await file.text());
    if(!d||d.app!=='petnote'||!Array.isArray(d.pets))throw new Error('format');
    var np=0,nl=0,nw=0,nv=0,i;
    (d.vaccLib||[]).forEach(function(l){if(l&&l.name){var g=libGet(l.name);if(!g)libAdd(l.name,+l.every||12,l.remind==null?14:+l.remind)}});
    for(i=0;i<d.pets.length;i++){if(d.pets[i]&&d.pets[i].id&&d.pets[i].name){await savePet(ensurePet(d.pets[i]));np++}}
    if(libDirty)await saveLib();
    for(i=0;i<(d.logs||[]).length;i++){var l=d.logs[i];if(l&&l.id&&l.petId){await saveLog(l);nl++}}
    for(i=0;i<(d.worms||[]).length;i++){var w=d.worms[i];if(w&&w.id&&w.petId){await saveWorm(w);nw++}}
    for(i=0;i<(d.vaccines||[]).length;i++){var v=d.vaccines[i];if(v&&v.id&&v.petId){await saveVacc(v);nv++}}
    if(!curPet()&&S.pets.length)S.sel=S.pets[0].id;
    render();toast('已匯入 '+np+' 隻寵物、'+nl+' 筆狀況、'+nw+' 筆驅蟲、'+nv+' 筆預防針');
  }catch(e){toast('這不是寵物筆記的備份檔')}
}

  render();toast('已載入範例，可在「設定」刪除');

/* ================= 手機通知（僅 Android App） ================= */
var Notif=(function(){
  var timer=null;
  function plug(){try{var c=window.Capacitor;if(c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.LocalNotifications)return c.Plugins.LocalNotifications}catch(e){}return null}
  async function status(){var P=plug();if(!P)return 'web';try{var r=await P.checkPermissions();return r.display||'prompt'}catch(e){return 'error'}}
  async function ask(){var P=plug();if(!P)return 'web';try{var r=await P.requestPermissions();return r.display||'denied'}catch(e){return 'error'}}
  function anyReminder(){return S.pets.some(function(p){return p.wormRemind||vItems(p).some(function(i){return i.remind>=0})})}
  function build(){
    var out=[],now=new Date(),td=today();
    var at=function(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0,0)};
    S.pets.forEach(function(p){
      vItems(p).forEach(function(it){
        if(it.remind<0)return;
        var st=vaccStatus(p,it,td);if(!st.due)return;
        var t1=at(addDays(st.due,-it.remind));
        if(t1>now)out.push({t:t1,title:p.name+'的預防針提醒',body:it.name+(it.remind===0?'今天到期':'將在 '+it.remind+' 天後（'+fmtD(ymd(st.due))+'）到期')});
        if(it.remind>0){var t2=at(st.due);if(t2>now)out.push({t:t2,title:p.name+'的預防針提醒',body:it.name+'今天到期'})}
      });
      if(p.wormRemind){
        for(var k=0;k<3;k++){
          var md=new Date(now.getFullYear(),now.getMonth()+k,p.wormDay),cm=ym(md),t=at(md);
          if(t<=now)continue;
          var names=(p.wormItems||[]).filter(function(it){return itemStatus(p,it,cm).state==='due'}).map(function(it){return it.name});
          if(names.length)out.push({t:t,title:p.name+'的驅蟲提醒',body:'今天該驅蟲了：'+names.join('、')});
        }
      }
    });
    out.sort(function(a,b){return a.t-b.t});
    return out.slice(0,60).map(function(o,i){return {id:i+1,title:o.title,body:o.body,schedule:{at:o.t,allowWhileIdle:true}}});
  }
  async function run(){
    var P=plug();if(!P)return;
    try{
      if(await status()!=='granted')return;
      var pend=await P.getPending();
      if(pend&&pend.notifications&&pend.notifications.length)await P.cancel({notifications:pend.notifications.map(function(n){return {id:n.id}})});
      var list=build();
      if(list.length)await P.schedule({notifications:list});
    }catch(e){}
  }
  function queue(){clearTimeout(timer);timer=setTimeout(run,800)}
  async function ensure(){
    if(!plug()||!anyReminder()||lsGet('petnote.notifAsked'))return;
    lsSet('petnote.notifAsked','1');
    var st=await status();
    if(st==='prompt'||st==='prompt-with-rationale')await ask();
    queue();
  }
  async function test(){
    var P=plug();if(!P)return false;
    try{await P.schedule({notifications:[{id:9999,title:'寵物筆記',body:'這是測試通知，看到這則代表提醒功能正常。',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});return true}catch(e){return false}
  }
  return {status:status,ask:ask,ensure:ensure,test:test,sync:queue};
})();
async function updateNotifCard(){
  var st=await Notif.status(),t=$('#notifTxt'),b=$('#notifBtns');
  if(!t||!b)return;
  var msg={
    web:'網頁版不會跳出手機通知，快到期的預防針與本月驅蟲會顯示在首頁最上方。Android 手機安裝 App 版，才會在早上 9:00 跳通知。',
    granted:'通知已開啟。預防針與驅蟲會依你設定的提醒時間，在早上 9:00 通知你。',
    denied:'通知被關閉了。請到手機「設定 → 應用程式 → 寵物筆記 → 通知」開啟。',
    error:'暫時無法確認通知狀態。'
  };
  t.textContent=msg[st]||'尚未允許通知，開啟後才能收到提醒。';
  b.innerHTML=st==='granted'?'<button class="btn block" data-act="notiftest" style="margin-top:12px">傳送測試通知</button>':((st==='prompt'||st==='prompt-with-rationale')?'<button class="btn primary block" data-act="notifask" style="margin-top:12px">開啟通知</button>':'');
}

/* ================= 事件 ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='tab'){S.tab=t.dataset.tab;$('#main').scrollTop=0;render()}
  else if(a==='selpet'){S.sel=t.dataset.id;lsSet('petnote.sel',S.sel);S.filter='all';render()}
  else if(a==='addpet')openPetSheet();
  else if(a==='editpet')openPetSheet(t.dataset.id||S.sel);
  else if(a==='addlog')openLogSheet();
  else if(a==='editlog')openLogSheet(t.dataset.id);
  else if(a==='filter'){S.filter=t.dataset.f;renderMain()}
  else if(a==='photo')openViewer(t.dataset.id,+t.dataset.idx);
  else if(a==='year'){S.year+=+t.dataset.d;renderMain()}
  else if(a==='wormdone')openWormSheet(t.dataset.item,t.dataset.month);
  else if(a==='wormset')openWormSettings();
  else if(a==='sample')loadSample();
  else if(a==='export')exportData();
  else if(a==='import'){var f=$('#importFile');if(f)f.click()}
  else if(a==='vaccadd')openVaccSheet(t.dataset.item);
  else if(a==='vaccedit')openVaccSheet(null,t.dataset.id);
  else if(a==='vaccset')openVaccSettings();
  else if(a==='libedit')openLibItem(t.dataset.name||null);
  else if(a==='wormadd')openWormBackfill();
  else if(a==='alertgo'){S.sel=t.dataset.pid;lsSet('petnote.sel',S.sel);S.tab=t.dataset.tab;$('#main').scrollTop=0;render()}
  else if(a==='notifask'){Notif.ask().then(function(){Notif.sync();updateNotifCard()})}
  else if(a==='notiftest'){Notif.test().then(function(ok){toast(ok?'5 秒後會收到測試通知':'無法傳送測試通知')})}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.entry[data-act]')){e.preventDefault();openLogSheet(e.target.dataset.id)}
  if(e.key==='Escape'&&Layers.length)closeTop();
});
document.addEventListener('change',function(e){
  if(e.target.id==='importFile'){var f=e.target.files&&e.target.files[0];if(f)importData(f);e.target.value=''}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('#themeSeg button[data-v]');if(!b)return;
  var v=b.dataset.v;lsSet('petnote.theme',v);applyTheme();$$('#themeSeg button').forEach(function(x){x.classList.toggle('on',x===b)});
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!Layers.length)render()});
function applyTheme(){
  var v=lsGet('petnote.theme'),r=document.documentElement;
  if(v==='light'||v==='dark')r.setAttribute('data-theme',v);else if(v==='system')r.removeAttribute('data-theme');
}

/* ================= 啟動 ================= */
(async function init(){
  applyTheme();
  await DB.open();
  S.pets=(await DB.all('pets')).sort(function(a,b){return a.created-b.created});
  S.logs=await DB.all('logs');S.worms=await DB.all('worms');S.vaccs=await DB.all('vaccines');
  var meta=(await DB.all('meta')).filter(function(m){return m.id==='vaccLib'})[0];
  if(meta&&Array.isArray(meta.items))S.lib=meta.items;else{S.lib=JSON.parse(JSON.stringify(DEFAULT_LIB));libDirty=true}
  S.pets.forEach(ensurePet);
  if(libDirty)await saveLib();
  for(var mi=0;mi<S.pets.length;mi++){if(S.pets[mi]._mig)await savePet(S.pets[mi])}
  var s=lsGet('petnote.sel');S.sel=(S.pets.filter(function(p){return p.id===s})[0]||S.pets[0]||{}).id||null;
  render();Notif.sync();
  if(!DB.ok)toast('目前無法永久儲存資料');
  try{
    var cap=window.Capacitor,native=cap&&cap.isNativePlatform&&cap.isNativePlatform();
    if(!native&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
    if(!native&&navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(function(p){if(!p)return navigator.storage.persist()}).catch(function(){});
  }catch(e){}
})();
})();
