<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E7E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="伴獸筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>伴獸筆記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：單欄手機 App。上方寵物切換、中間內容、下方四個分頁。招牌元素是驅蟲「集章」格，像寵物健康手冊蓋章。 */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface2:#F0EEEA; --ink:#1E2326; --ink2:#5E676B; --line:#E2DFD9;
  --k:#E07B39; --k-bg:#FDF0E6; --k-tr:#F6D5BE; --k-fg:#9A4A15;
  --wa:#3A86D8; --wa-bg:#EAF3FC; --wa-tr:#C9DEF5; --wa-fg:#1E5797;
  --ex:#2F9A5E; --ex-bg:#E8F5EE; --ex-tr:#C5E6D2; --ex-fg:#1D6B3F;
  --wt:#7A62C9; --wt-bg:#F1EEFB; --wt-tr:#D9D1F3; --wt-fg:#4F3A9A;
  --pet-hi:#2A8C9C; --round:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Noto Sans TC",sans-serif;
  --primary:#0F6E7E; --on-primary:#FFFFFF; --primary-soft:#D5EBEE;
  --accent:#D9691F; --accent-soft:#FBE5D2;
  --ok:#277D50; --ok-soft:#D6EFE1; --bad:#B93B35; --bad-soft:#F8DCD9;
  --shadow:0 1px 2px rgba(20,38,43,.06),0 6px 18px rgba(20,38,43,.06);
  --scrim:rgba(10,20,22,.5);
  --ts:55%; --tl:34%; --bs:62%; --bl:91%;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --navpad:0px;
  --font:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121516; --surface:#1B1F21; --surface2:#252A2D; --ink:#E9ECEC; --ink2:#A3ADB0; --line:#333A3D;
    --k:#F2A061; --k-bg:#2E2219; --k-tr:#4A3423; --k-fg:#F7C193;
    --wa:#7DB5F0; --wa-bg:#1A2635; --wa-tr:#2A3D55; --wa-fg:#A9CDF5;
    --ex:#6CCB94; --ex-bg:#18291F; --ex-tr:#26402F; --ex-fg:#9BDDB6;
    --wt:#AE9CF0; --wt-bg:#231F35; --wt-tr:#3A3254; --wt-fg:#C9BDF6;
    --primary:#5CC1D0; --on-primary:#06262B; --primary-soft:#173B41;
    --accent:#F29A5B; --accent-soft:#41291A;
    --ok:#5CCB93; --ok-soft:#173528; --bad:#F27D75; --bad-soft:#401E1C;
    --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
    --ts:68%; --tl:74%; --bs:32%; --bl:21%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121516; --surface:#1B1F21; --surface2:#252A2D; --ink:#E9ECEC; --ink2:#A3ADB0; --line:#333A3D;
  --k:#F2A061; --k-bg:#2E2219; --k-tr:#4A3423; --k-fg:#F7C193;
  --wa:#7DB5F0; --wa-bg:#1A2635; --wa-tr:#2A3D55; --wa-fg:#A9CDF5;
  --ex:#6CCB94; --ex-bg:#18291F; --ex-tr:#26402F; --ex-fg:#9BDDB6;
  --wt:#AE9CF0; --wt-bg:#231F35; --wt-tr:#3A3254; --wt-fg:#C9BDF6;
  --primary:#5CC1D0; --on-primary:#06262B; --primary-soft:#173B41;
  --accent:#F29A5B; --accent-soft:#41291A;
  --ok:#5CCB93; --ok-soft:#173528; --bad:#F27D75; --bad-soft:#401E1C;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  --ts:68%; --tl:74%; --bs:32%; --bl:21%;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:var(--scrim);padding:24px}
.busy .dlg{transform:none;opacity:1;text-align:center}
.busy .dlg p{margin:0}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{display:block;flex:none}
b{font-weight:700}
small{font-size:12.5px;color:var(--ink2)}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
#top{flex:none;padding-top:10px;padding-bottom:6px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--primary)}
.today{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 8px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;max-width:60vw}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.pchip.add{padding:0;width:44px;justify-content:center;color:var(--primary);border-style:dashed}

.mainwrap{position:relative;flex:1;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-top:6px;padding-bottom:96px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.linkbtn{color:var(--primary);font-weight:600;font-size:14px;min-height:36px;padding:0 4px;display:flex;align-items:center;gap:2px}

.av{width:var(--s,48px);height:var(--s,48px);border-radius:30%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s,48px)*.42);color:hsl(var(--h,200) var(--ts) var(--tl));background:hsl(var(--h,200) var(--bs) var(--bl))}
.pchip .av{border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--pc,var(--line))}

.pet{border-radius:24px;padding:18px}
.pet-top{display:flex;gap:14px;align-items:center}
.pet-top .grow{flex:1;min-width:0}
.pet h1{margin:0;font-size:25px;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.pet .meta{color:var(--ink2);font-size:14px;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);background:var(--surface2);flex:none}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:16px 0 0;border-top:1px dashed var(--line)}
.facts div{padding:10px 0 0}
.facts div+div{padding-left:14px;border-left:1px dashed var(--line)}
.facts dt{font-size:12.5px;color:var(--ink2)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.age{margin-top:14px;padding:14px;border-radius:14px;background:var(--primary-soft)}
.age-nums{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.age-nums span{font-size:15px;color:var(--primary)}
.age-nums b{font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-right:3px}
.age .sub{margin-top:6px;font-size:13.5px;color:var(--ink2)}
.age .party{margin-top:8px;display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent);color:var(--surface);font-weight:700;font-size:13.5px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}

.annbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.annbig b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.02em}
.annbig span{color:var(--ink2);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.todaybanner{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:var(--accent);color:var(--surface);font-weight:700}
.evlist{list-style:none;margin:10px 0 0;padding:0}
.evlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.evlist .when{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.evlist .nm{font-weight:600}
.evlist small{display:block}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.cnt{background:var(--primary-soft);color:var(--primary)}

.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cardhead+.wrow{border-top:0;padding-top:0}
.wrow .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mini{min-height:36px;padding:0 14px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px}

.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;color:hsl(var(--h,200) var(--ts) var(--tl));background:hsl(var(--h,200) var(--bs) var(--bl))}
.recent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.recent:first-of-type{border-top:0;padding-top:0}
.recent .tx{flex:1;min-width:0}
.recent .tx p{margin:2px 0 0;color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recent time{font-size:12.5px;color:var(--ink2);white-space:nowrap}

.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.pagehead h2{margin:0;font-size:22px;font-weight:800}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 14px 0;padding-right:max(16px,env(safe-area-inset-right,0px))}
.filters::-webkit-scrollbar{display:none}
.wcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.wcard .grow{flex:1;min-width:0}
.wcard .lb{font-size:12.5px;color:var(--ink2);display:block}
.wcard .kg{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wcard .kg small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:2px}
.wcard .sub{font-size:12.5px;color:var(--ink2);display:block}
.wcard svg{flex:none}
.delta{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface);color:var(--ink2);margin-left:6px;font-variant-numeric:tabular-nums;vertical-align:middle}
.wchart{position:relative;margin:4px 0 6px;touch-action:pan-y}
.wchart svg{display:block;width:100%;height:auto;overflow:visible}
.wchart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hcards.one{grid-template-columns:1fr}
.hcard.wide{grid-column:1/-1}
.mbar.over i{background:var(--warn,#C2410C)}
.menubox{background:var(--surface2);border-radius:14px;padding:10px 12px;margin:4px 0 8px}
.menulist div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.menulist div:last-child{border-bottom:0}
.menulist span{color:var(--ink2);white-space:nowrap}
.gagrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
[data-newfood]{display:inline-flex;align-items:center;gap:4px}
.mealsum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--surface2)}
.ms-main{flex:1 1 210px;min-width:0;text-align:left;display:block;padding:2px 0}
.ms-top{display:flex;align-items:center;gap:8px;font-size:13.5px}
.ms-top b{white-space:nowrap}
.ms-acts{margin-left:auto}
.ms-dots{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.ms-dots i{width:9px;height:9px;border-radius:50%;display:block;border:1.5px solid var(--ink2);opacity:.6}
.ms-dots i.d-done{background:var(--ok,#277D50);border-color:var(--ok,#277D50);opacity:1}
.ms-dots i.d-auto{background:hsl(215 60% 55%);border-color:hsl(215 60% 55%);opacity:1}
.ms-dots i.d-wauto{border-color:hsl(215 60% 55%);border-style:dotted;opacity:1}
.ms-dots i.d-extra{width:7px;height:7px;align-self:center}
.ms-sub{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ms-sub b{color:var(--ink);font-weight:700}
.ms-acts{display:flex;gap:6px;flex:none}
.ms-btn{display:inline-flex;align-items:center;gap:3px;min-height:36px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:700;background:var(--surface);color:var(--ink2);box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.ms-btn.primary{background:var(--primary);color:var(--on-primary,#fff);box-shadow:none}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:8px;align-items:center;min-height:42px;padding:4px 2px;border-bottom:1px dashed var(--line);text-align:left;font-size:14px}
.mrow:last-child{border-bottom:0}
.mrow .t{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:13px}
.mrow .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .n small{font-weight:600;font-size:11px;color:var(--ink2);margin-left:6px}
.mrow .k{color:var(--ink2);font-size:12.5px;white-space:nowrap}
.mrow .ok{color:var(--ok,#277D50);display:inline-flex}
.mrow .wait{font-size:11.5px;color:hsl(215 55% 50%);white-space:nowrap}
.mrow .todo{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--primary);white-space:nowrap}
.mealrow{margin-top:10px}
.mealrow .lb{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:6px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:12px;border:1.5px dashed var(--primary);color:var(--primary);background:var(--surface);font-size:13.5px;text-align:left}
.mchip b{font-weight:800}
.mchip span{color:var(--ink2);font-size:12.5px}
.mchip.done{border-style:solid;border-color:transparent;background:var(--soft,var(--surface2));color:var(--ok,#277D50)}
.hcard,.wcard{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hcard:active,.wcard:active{filter:brightness(.97)}
.hcard{padding-right:46px}
.hc-chart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--primary);box-shadow:0 0 0 1px var(--line)}
.wcard{padding-right:52px}
.wcard .hc-chart{top:50%;transform:translateY(-50%)}
.mchip.autodone{background:hsl(215 60% 94%);color:hsl(215 55% 38%)}
.autobadge{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:hsl(215 60% 94%);color:hsl(215 55% 30%);margin:0 0 12px}
.autobadge.warn{background:hsl(35 90% 92%);color:hsl(30 70% 30%)}
.autobadge small{display:block;color:inherit;opacity:.85;font-size:12.5px;margin-top:2px}
.autoitems{margin:0 0 10px}
.airow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.airow .fn{flex:1;min-width:0;font-weight:700}
.airow .am,.airow .kc{color:var(--ink2);white-space:nowrap}
.airow input{width:62px!important;min-height:36px!important;padding:4px 6px!important;text-align:center}
.autotag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:hsl(215 60% 94%);color:hsl(215 55% 38%);white-space:nowrap;margin-right:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mchip.autodone,:root:not([data-theme=light]) .autobadge,:root:not([data-theme=light]) .autotag{background:hsl(215 35% 22%);color:hsl(215 70% 80%)}:root:not([data-theme=light]) .autobadge.warn{background:hsl(30 40% 20%);color:hsl(35 80% 80%)}}
:root[data-theme=dark] .mchip.autodone,:root[data-theme=dark] .autobadge,:root[data-theme=dark] .autotag{background:hsl(215 35% 22%);color:hsl(215 70% 80%)}
:root[data-theme=dark] .autobadge.warn{background:hsl(30 40% 20%);color:hsl(35 80% 80%)}
.mcauto{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.mn-tl{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.mn-tl input{width:118px!important;min-height:38px!important;padding:6px 8px!important}
.mn-autow{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
.mchip.auto{border-style:dotted}
.mchip.extra{border-style:dashed;color:var(--ink2);border-color:var(--line)}
.mealcard{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.mchead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mchead .mn-lb{flex:1;min-height:40px!important;padding:6px 10px!important;font-weight:700}
.mchead .mn-k{color:var(--ink2);font-size:13px;white-space:nowrap}
.mcfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mn-wl{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);white-space:nowrap;flex:none}
.mn-wl input{width:80px!important;flex:none;min-height:38px!important;padding:6px 8px!important;text-align:center}
.firow{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px auto 34px;gap:6px;align-items:center;margin-bottom:8px}
.firow:not(:has(.fi-left)){grid-template-columns:minmax(0,1fr) 70px 70px 34px}
.firow .fn{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.firow .fn small{display:block;font-weight:500;color:var(--ink2);font-size:12px}

<script>
(function(){
'use strict';
/* ================= 基本工具 ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var ym=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var parseD=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var today=function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
var dayDiff=function(a,b){return Math.round((a-b)/864e5)};
var addDays=function(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)};
var addMonths=function(d,n){var t=new Date(d.getFullYear(),d.getMonth()+n,1);var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d.getDate(),last));return t};
var monthAdd=function(m,n){var a=m.split('-').map(Number);return ym(new Date(a[0],a[1]-1+n,1))};
var monthsBetween=function(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return (y[0]-x[0])*12+(y[1]-x[1])};
var WD=['日','一','二','三','四','五','六'];
var fmtD=function(s){return s?s.replace(/-/g,'/'):''};
var toLocalInput=function(ts){var d=new Date(ts);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
var hhmm=function(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
var lsGet=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var lsSet=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var APP_VERSION='1.11.0';
function isNative(){try{var c=window.Capacitor;return !!(c&&c.isNativePlatform&&c.isNativePlatform())}catch(e){return false}}
/* ---- App 版：檢查 GitHub 上的新版本 ---- */
var UPDATE_REPO='FOX-loop/petnote-web';
var IS_PLAY=false; /* Google Play 版編譯時會改成 true：關閉 App 內更新提示，改由 Play 商店更新 */
var PRIVACY_URL='https://fox-loop.github.io/petnote-web/privacy.html';
function verCmp(a,b){a=String(a).replace(/^v/i,'').split('.').map(Number);b=String(b).replace(/^v/i,'').split('.').map(Number);for(var i=0;i<3;i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x>y?1:-1}return 0}
var Updater={
  checking:false,last:null,
  async fetchLatest(){
    var r=await fetch('https://api.github.com/repos/'+UPDATE_REPO+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error('http '+r.status);
    var j=await r.json(),asset=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name)})[0];
    return {version:String(j.tag_name||'').replace(/^v/i,''),notes:j.body||'',url:asset?asset.browser_download_url:'https://github.com/'+UPDATE_REPO+'/releases/latest/download/PetNote.apk',page:j.html_url||('https://github.com/'+UPDATE_REPO+'/releases/latest'),size:asset?asset.size:0};
  },
  async check(manual){
    if(!isNative()||IS_PLAY||this.checking)return;
    if(!manual){var lc=+(lsGet('petnote.updChecked')||0);if(Date.now()-lc<6*3600e3)return}
    this.checking=true;
    try{
      var info=await this.fetchLatest();lsSet('petnote.updChecked',String(Date.now()));this.last=info;
      if(!info.version||verCmp(info.version,APP_VERSION)<=0){if(manual)infoDlg('已經是最新版本（'+APP_VERSION+'）。');return}
      if(!manual){var sn=JSON.parse(lsGet('petnote.updSnooze')||'{}');if(sn.v===info.version&&Date.now()<sn.until)return}
      this.prompt(info);
    }catch(e){if(manual)infoDlg('目前無法檢查更新，請確認網路連線後再試一次。')}
    finally{this.checking=false;var t=$('#updTxt');if(t)paintUpdTxt()}
  },
  prompt(info){
    var notes=info.notes.replace(/\r/g,'').split('\n').map(function(l){return l.replace(/^#+\s*/,'').replace(/\*\*/g,'').replace(/^[-*]\s+/,'・').trim()}).filter(Boolean).slice(0,10).join('\n');
    var el=document.createElement('div');el.className='layer center';
    el.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true" style="max-width:400px"><p style="margin:0 0 6px;font-size:18px;font-weight:800">有新版本 '+esc(info.version)+'</p><p style="margin:0 0 10px;font-size:13.5px;color:var(--ink2)">目前版本 '+esc(APP_VERSION)+(info.size?'・下載約 '+(info.size/1048576).toFixed(1)+' MB':'')+'</p>'+
      (notes?'<div style="max-height:40vh;overflow:auto;white-space:pre-line;font-size:14px;line-height:1.6;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:12px">'+esc(notes)+'</div>':'')+
      '<p style="margin:0 0 14px;font-size:13px;color:var(--ink2)">按「下載更新」後，等下載完成點開檔案，再按「更新」即可，資料會保留。</p>'+
      '<div class="row"><button class="btn" data-later>稍後再說</button><a class="btn primary" data-dl href="'+esc(info.url)+'" target="_blank" rel="noopener" style="text-decoration:none">下載更新</a></div></div>';
    el.addEventListener('click',function(e){
      if(e.target.closest('[data-later]')||e.target===el){lsSet('petnote.updSnooze',JSON.stringify({v:info.version,until:Date.now()+864e5}));closeTop();return}
      if(e.target.closest('[data-dl]')){lsSet('petnote.updSnooze',JSON.stringify({v:info.version,until:Date.now()+3600e3}));setTimeout(closeTop,300);toast('開始下載，完成後點開檔案按「更新」')}
    });
    pushLayer(el);
  }
};
function paintUpdTxt(){
  var t=$('#updTxt');if(!t)return;var i=Updater.last;
  t.innerHTML=Updater.checking?'正在檢查…':(i&&i.version&&verCmp(i.version,APP_VERSION)>0?'有新版本 '+esc(i.version)+'　<button class="linkbtn" data-act="updnow" style="display:inline-flex;padding:0;min-height:0">查看</button>':(i?'已是最新版本（'+esc(APP_VERSION)+'）':'開啟 App 時會自動檢查新版本'));
}
function apkUrl(){
  var m=/^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);if(!m)return '';
  var repo=(location.pathname.split('/').filter(Boolean)[0]||'');
  if(!repo||/\.html?$/i.test(repo))return '';
  return 'https://github.com/'+m[1]+'/'+repo+'/releases/latest/download/PetNote.apk';
}

var IC={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',

/* ================= 日期計算 ================= */
function ageParts(b,now){
  if(b>now) return null;
  var total=(now.getFullYear()-b.getFullYear())*12+now.getMonth()-b.getMonth();
  if(addMonths(b,total)>now) total--;
  var base=addMonths(b,total);
  return {y:Math.floor(total/12),m:total%12,d:dayDiff(now,base)};
}
function nextAnn(d,now){
  var y=Math.max(now.getFullYear(),d.getFullYear()+1);
  for(var i=0;i<3;i++,y++){
    var last=new Date(y,d.getMonth()+1,0).getDate();
    var dt=new Date(y,d.getMonth(),Math.min(d.getDate(),last));
    if(dt>=now) return {date:dt,years:y-d.getFullYear()};
  }
  return null;
}
function annEvents(home,now){
  var ev=[],n=nextAnn(home,now);
  if(n){
    ev.push({label:'來家 '+n.years+' 週年',date:n.date});
    var d2=new Date(n.date.getFullYear()+1,home.getMonth(),home.getDate());
    ev.push({label:'來家 '+(n.years+1)+' 週年',date:d2});
  }
  [100,200,300,500,1000,1500,2000,2500,3000,4000,5000].forEach(function(k){
    var d=addDays(home,k-1); if(d>=now) ev.push({label:'來家第 '+k+' 天',date:d});
  });
  ev.sort(function(a,b){return a.date-b.date});
  return ev.slice(0,3);
}
function relDays(date,now){
  var n=dayDiff(date,now);
  return n===0?'就是今天':(n+' 天後');
}

function readImage(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function shrinkDataUrl(src,max,q){
  return new Promise(function(res){
    var img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      try{var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(src)}
    };
    img.onerror=function(){res(src)};
    img.src=src;
  });
}
/* ---- 照片：原圖與縮圖分開存放，畫面只在需要時讀取 ---- */
var Photos=(function(){
  var cache=new Map(),MAX=150,io=null;
  function remember(id,v){cache.delete(id);cache.set(id,v);if(cache.size>MAX)cache.delete(cache.keys().next().value)}
  function isId(x){return typeof x==='string'&&x.indexOf('ph_')===0}
  async function thumb(id){
    if(cache.has(id)){var v=cache.get(id);remember(id,v);return v}
    var r=await DB.get('thumbs',id);if(!r){var f=await DB.get('photos',id);if(f){r={id:id,data:await shrinkDataUrl(f.data,360,.72)};await DB.put('thumbs',r)}}
    if(r){remember(id,r.data);return r.data}return null;
  }
  async function full(id){var r=await DB.get('photos',id);return r?r.data:null}
  async function put(id,data,th){
    th=th||await shrinkDataUrl(data,360,.72);
    if(!await DB.put('photos',{id:id,data:data}))return false;
    if(!await DB.put('thumbs',{id:id,data:th})){await DB.del('photos',id);return false}
    remember(id,th);return true;
  }
  async function add(data,th){var id='ph_'+uid();return (await put(id,data,th))?id:null}
  async function remove(ids){for(var i=0;i<ids.length;i++){if(!isId(ids[i]))continue;cache.delete(ids[i]);await DB.del('photos',ids[i]);await DB.del('thumbs',ids[i])}}
  function load(img){
    var id=img.getAttribute('data-ph');if(!id||img.getAttribute('src'))return;
    img.setAttribute('data-loading','1');
    thumb(id).then(function(v){if(v&&img.getAttribute('data-ph')===id)img.src=v});
  }
  function hydrate(root){
    var imgs=$$('img[data-ph]:not([src])',root||document);if(!imgs.length)return;
    if(!('IntersectionObserver' in window)){imgs.forEach(load);return}
    if(!io)io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);load(e.target)}})},{rootMargin:'400px 0px'});
    imgs.forEach(function(i){if(!i.getAttribute('data-loading'))io.observe(i)});
  }
  return {isId:isId,thumb:thumb,full:full,put:put,add:add,remove:remove,hydrate:hydrate,cached:function(id){return cache.get(id)||''}};
})();
async function migratePhotos(){
  var todo=S.logs.filter(function(l){return (l.photos||[]).some(function(p){return !Photos.isId(p)})});
  if(!todo.length)return;
  var failed=false;
  var total=todo.reduce(function(n,l){return n+l.photos.filter(function(p){return !Photos.isId(p)}).length},0),done=0;
  var m=$('#main');
  for(var i=0;i<todo.length;i++){
    var l=todo[i],ids=[];
    for(var j=0;j<l.photos.length;j++){
      var p=l.photos[j];
      if(Photos.isId(p)){ids.push(p);continue}
      if(typeof p==='string'&&p.indexOf('data:')===0){
        var nid=await Photos.add(p);
        if(!nid){ids=ids.concat(l.photos.slice(j));failed=true;break}
        ids.push(nid);
      }
      done++;if(m)m.innerHTML='<div class="empty"><h3>正在整理照片</h3><p>第 '+done+' / '+total+' 張，只有這一次，請不要關閉 App。</p></div>';
    }
    if(!await DB.put('logs',Object.assign({},l,{photos:ids}))){failed=true}
    else l.photos=ids;
    if(failed)break;
  }
  if(failed)setTimeout(function(){toast('手機空間不足，部分照片尚未整理完成，原照片都保留著。清出空間後重新開啟 App 會繼續。')},600);
}

function itemStatus(pet,item,cm){
  var done=S.worms.filter(function(w){return w.id===wid(pet.id,cm,item.name)})[0];
  if(done) return {state:'done',rec:done};
  var prev=S.worms.filter(function(w){return w.petId===pet.id&&w.item===item.name&&w.month<cm}).sort(function(a,b){return a.month<b.month?1:-1})[0];
  if(!prev) return {state:'due'};
  if(monthsBetween(prev.month,cm)>=item.every) return {state:'due',last:prev};
  return {state:'wait',next:monthAdd(prev.month,item.every),last:prev};
}
function planMonth(pet,item,cm){
  var last=S.worms.filter(function(w){return w.petId===pet.id&&w.item===item.name}).sort(function(a,b){return a.month<b.month?1:-1})[0];
  if(!last) return cm;
  var nx=monthAdd(last.month,item.every);
  return nx<cm?cm:nx;
}

function pagerHtml(page,pages,attr){

  var nums=[],set={};
  [1,pages,page-1,page,page+1].forEach(function(p){if(p>=1&&p<=pages&&!set[p]){set[p]=1;nums.push(p)}});
  if(page<=3)[2,3,4].forEach(function(p){if(p<=pages&&!set[p]){set[p]=1;nums.push(p)}});
  if(page>=pages-2)[pages-3,pages-2,pages-1].forEach(function(p){if(p>=1&&!set[p]){set[p]=1;nums.push(p)}});
  nums.sort(function(a,c){return a-c});
  var h=b(page-1,'‹','上一頁',page===1,false),last=0;
  nums.forEach(function(p){if(p-last>1)h+='<span class="gap">…</span>';h+=b(p,p,'第 '+p+' 頁',false,p===page);last=p});

function niceStep(range,count){var raw=range/Math.max(1,count),p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function weightChart(pts){
  if(!pts.length)return '';
  var W=340,H=196,L=38,R=14,T=26,B=24;
  var t0=pts[0].t,t1=pts[pts.length-1].t;if(t1===t0){t0-=864e5*15;t1+=864e5*15}
  var lo=Math.min.apply(null,pts.map(function(p){return p.kg})),hi=Math.max.apply(null,pts.map(function(p){return p.kg}));
  if(hi-lo<0.4){var mid=(hi+lo)/2;lo=mid-0.2;hi=mid+0.2}
  var st=niceStep(hi-lo,4);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;
  var X=function(t){return L+(W-L-R)*(t-t0)/(t1-t0)},Y=function(k){return T+(H-T-B)*(1-(k-lo)/(hi-lo))};
  var g='';
  for(var k=lo;k<=hi+1e-9;k+=st){var y=Y(k).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+y+'" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="var(--ink2)">'+fmtKg(k)+'</text>'}
  var fd=function(t){var d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)};
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="10.5" fill="var(--ink2)">'+fd(pts[0].t)+'</text>';
  if(pts.length>1)g+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10.5" fill="var(--ink2)">'+fd(pts[pts.length-1].t)+'</text>';
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.kg).toFixed(1)}).join(' ');
  var area=pts.length>1?'<path d="'+line+' L'+X(pts[pts.length-1].t).toFixed(1)+' '+(H-B)+' L'+X(pts[0].t).toFixed(1)+' '+(H-B)+' Z" fill="var(--wt)" opacity=".1"/>':'';
  var many=pts.length>40;
  var dots=pts.map(function(p,i){var last=i===pts.length-1;if(many&&!last)return '';return '<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="'+(last?5:4)+'" fill="'+(p.src==='vacc'?'var(--surface)':'var(--wt)')+'" stroke="var(--wt)" stroke-width="2"/>'}).join('');
  var lp=pts[pts.length-1];
  var lab='<text x="'+Math.min(X(lp.t),W-R).toFixed(1)+'" y="'+(Y(lp.kg)-12).toFixed(1)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+fmtKg(lp.kg)+' kg</text>';
  var json=JSON.stringify(pts.map(function(p){return [X(p.t),Y(p.kg)]}));
  return '<div class="wchart" data-pts=\''+json+'\'><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="體重變化折線圖，最新 '+fmtKg(lp.kg)+' 公斤">'+g+area+(pts.length>1?'<path d="'+line+'" fill="none" stroke="var(--wt)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+dots+lab+'<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/></svg><div class="tip" hidden></div></div>';
}

        c.addEventListener('pointerleave',function(){tip.hidden=true;xh.setAttribute('visibility','hidden')});
      }
      bindSeg($('#w-range',el),function(v){range=v;page=1;paint()});
      box.addEventListener('click',function(e){var pg=e.target.closest('[data-wpg]');if(pg){if(pg.disabled)return;page=+pg.getAttribute('data-wpg');paintList();var hd=$('#w-listhead',box);if(hd)hd.scrollIntoView({block:'start'});return}var r=e.target.closest('[data-wid]');if(!r)return;if(r.dataset.wsrc==='vacc')openVaccSheet(null,r.dataset.wid);else openLogSheet(r.dataset.wid)});

var EVERY_OPTS=[3,6,12,24,36],REMIND_OPTS=[-1,0,1,3,7,14,30];
function everyLabel(n){return n===12?'每年':(n%12===0?'每 '+(n/12)+' 年':(n===1?'每月':'每 '+n+' 個月'))}
function remindLabel(r){return r<0?'不提醒':(r===0?'到期當天提醒':'提前 '+r+' 天提醒')}
function optList(list,val,fn){
  var l=list.indexOf(val)<0?list.concat([val]).sort(function(a,b){return a-b}):list;
  return l.map(function(n){return '<option value="'+n+'" '+(n===val?'selected':'')+'>'+fn(n)+'</option>'}).join('');
}
function vaccStatus(p,it,now){
  var mem=it.members||[it.name];
  var recs=S.vaccs.filter(function(v){return v.petId===p.id&&mem.indexOf(v.item)>=0}).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(b.id>a.id?1:-1))});
  if(!recs.length)return {state:'none',recs:recs};
  var last=recs[0],due=last.next?parseD(last.next):addMonths(parseD(last.date),it.every),days=dayDiff(due,now);
  var state=days<0?'overdue':((it.remind>=0&&days<=it.remind)?'soon':'ok');
  return {state:state,last:last,due:due,days:days,recs:recs};
}
function vaccChip(st,it){
  if(st.state==='none')return '<span class="pill">尚無紀錄</span>';
  var txt=st.days<0?'已逾期 '+(-st.days)+' 天':(st.days===0?'今天到期':'還有 '+st.days+' 天');
  var warn=it.remind>=0&&(st.state==='overdue'||st.state==='soon');
  return '<span class="pill '+(warn?'warn':'')+'">'+txt+'</span>';
}

var BACKUP_OPTS=[[7,'每週'],[30,'每月'],[90,'每 3 個月'],[0,'不提醒']];
function bkIsCustom(){return !!S.backup.every&&!BACKUP_OPTS.some(function(o){return o[0]===S.backup.every})}
function bkOptsHtml(){var c=bkIsCustom();function op(o){return '<option value="'+o[0]+'" '+(!c&&S.backup.every===o[0]?'selected':'')+'>'+o[1]+'</option>'}
  return BACKUP_OPTS.filter(function(o){return o[0]}).map(op).join('')+'<option value="c" '+(c?'selected':'')+'>自訂天數…</option>'+BACKUP_OPTS.filter(function(o){return !o[0]}).map(op).join('')}
function backupBase(){return S.backup.last||S.backup.since||Date.now()}
function backupDue(){if(!S.backup.every)return null;var b=new Date(backupBase());return new Date(b.getFullYear(),b.getMonth(),b.getDate()+S.backup.every)}
function backupOverdueDays(){var d=backupDue();if(!d)return -1;return dayDiff(today(),d)}
async function saveBackupMeta(){saved(await DB.put('meta',Object.assign({id:'backup'},S.backup)));Notif.sync()}

function paintBackupTxt(){
  var t=$('#bkTxt');if(!t)return;
  if(!S.backup.last){t.textContent='還沒有在這支手機匯出過備份。';return}
  var d=new Date(S.backup.last),ago=dayDiff(today(),new Date(d.getFullYear(),d.getMonth(),d.getDate()));
  t.textContent='上次備份：'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'（'+(ago===0?'今天':ago+' 天前')+'）';
}
function alertsAll(now){
  var out=[];
  S.pets.forEach(function(p){
    vItems(p).forEach(function(it){
      if(it.remind<0)return;
      var st=vaccStatus(p,it,now);if(st.state!=='soon'&&st.state!=='overdue')return;
      out.push({tone:st.state==='overdue'?'bad':'warn',pid:p.id,tab:'vaccine',text:p.name+'・'+it.name+' '+(st.days<0?'已逾期 '+(-st.days)+' 天':(st.days===0?'今天到期':st.days+' 天後到期'))});
    });
    if(p.wormRemind&&now.getDate()>=p.wormDay){
      var cm=ym(now),names=(p.wormItems||[]).filter(function(it){return itemStatus(p,it,cm).state==='due'}).map(function(it){return it.name});
      if(names.length)out.push({tone:'warn',pid:p.id,tab:'deworm',text:p.name+'・本月驅蟲待辦：'+names.join('、')});
    }
  });
  if(S.pets.length&&S.backup.every){
    var od=backupOverdueDays();
    if(od>=0){var since=dayDiff(today(),new Date(new Date(backupBase()).setHours(0,0,0,0)));
      out.push({tone:'warn',act:'exportnow',text:S.backup.last?'已經 '+since+' 天沒備份了，點這裡匯出備份':'還沒備份過資料，點這裡匯出備份'});}
  }
  return out;
}

function vprog(st,now){
  if(!st.last||!st.due)return '';var a=parseD(st.last.date),tot=Math.max(1,dayDiff(st.due,a)),el=dayDiff(now,a),f=Math.max(0,Math.min(1,el/tot)),dd=dayDiff(st.due,now);

async function exportData(){
  if(exportData.busy)return;exportData.busy=true;
  try{
    var name='伴獸筆記備份-'+ymd(new Date())+'.json';
    var ids=[];S.logs.forEach(function(l){(l.photos||[]).forEach(function(p){if(Photos.isId(p))ids.push(p)})});
    var head=JSON.stringify({app:'petnote',version:4,exported:new Date().toISOString(),vaccLib:S.lib,vaccGroups:S.groups,foods:S.foods,pets:S.pets,logs:S.logs,worms:S.worms,vaccines:S.vaccs});
    head=head.slice(0,-1)+',"photos":{';
    var cap=window.Capacitor,P=cap&&cap.Plugins,native=isNative()&&P&&P.Filesystem&&P.Share;
    var blob=native?null:new Blob([head],{type:'application/json'}),parts=[],first=true;
    if(native)await P.Filesystem.writeFile({path:name,data:head,directory:'CACHE',encoding:'utf8'});
    async function flush(){
      if(!parts.length)return;
      var chunk=parts.join('');parts=[];
      if(native)await P.Filesystem.appendFile({path:name,data:chunk,directory:'CACHE',encoding:'utf8'});
      else blob=new Blob([blob,chunk],{type:'application/json'});
    }
    for(var i=0;i<ids.length;i++){
      var data=await Photos.full(ids[i]);if(!data)continue;
      parts.push((first?'':',')+JSON.stringify(ids[i])+':'+JSON.stringify(data));first=false;
      if(parts.length>=10){await flush();toast('正在匯出照片 '+(i+1)+' / '+ids.length)}
    }
    parts.push('}}');await flush();
    if(native){
      var u=await P.Filesystem.getUri({path:name,directory:'CACHE'});
      try{await P.Share.share({title:name,url:u.uri,dialogTitle:'儲存或分享備份檔'});await markBackedUp();toast('已匯出備份')}catch(e){}
      return;
    }
    try{
      var file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});await markBackedUp();toast('已匯出備份');return}
    }catch(e){ if(e&&e.name==='AbortError')return; }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    await markBackedUp();toast('已產生備份檔');
  }catch(e){toast('匯出失敗，請確認手機空間是否足夠')}
  finally{exportData.busy=false}
}

      }

    for(i=0;i<(d.worms||[]).length;i++){var w=d.worms[i];if(w&&w.id&&w.petId){await saveWorm(w);nw++}}

  }catch(e){Busy.hide();render();await infoDlg('匯入到一半發生問題，已匯入的部分都保留著。\n可能是手機空間不足，清出空間後再匯入一次即可（重複匯入不會產生重複資料）。')}
}

/* ================= 手機通知（僅 Android App） ================= */
var Notif=(function(){
  var timer=null;
  function plug(){try{var c=window.Capacitor;if(c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.LocalNotifications)return c.Plugins.LocalNotifications}catch(e){}return null}
  async function status(){var P=plug();if(!P)return 'web';try{var r=await P.checkPermissions();return r.display||'prompt'}catch(e){return 'error'}}
  async function ask(){var P=plug();if(!P)return 'web';try{var r=await P.requestPermissions();return r.display||'denied'}catch(e){return 'error'}}
  function anyReminder(){return !!S.backup.every||S.pets.some(function(p){return p.wormRemind||vItems(p).some(function(i){return i.remind>=0})})}
  function build(){
    var out=[],now=new Date(),td=today();
    var at=function(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0,0)};
    S.pets.forEach(function(p){
      vItems(p).forEach(function(it){
        if(it.remind<0)return;
        var st=vaccStatus(p,it,td);if(!st.due)return;
        var t1=at(addDays(st.due,-it.remind));
        if(t1>now)out.push({t:t1,title:p.name+'的預防針提醒',body:it.name+(it.remind===0?'今天到期':'將在 '+it.remind+' 天後（'+fmtD(ymd(st.due))+'）到期')});
        if(it.remind>0){var t2=at(st.due);if(t2>now)out.push({t:t2,title:p.name+'的預防針提醒',body:it.name+'今天到期'})}
      });
      if(p.wormRemind){
        for(var k=0;k<3;k++){
          var md=new Date(now.getFullYear(),now.getMonth()+k,p.wormDay),cm=ym(md),t=at(md);
          if(t<=now)continue;
          var names=(p.wormItems||[]).filter(function(it){return itemStatus(p,it,cm).state==='due'}).map(function(it){return it.name});
          if(names.length)out.push({t:t,title:p.name+'的驅蟲提醒',body:'今天該驅蟲了：'+names.join('、')});
        }
      }
    });
    if(S.pets.length&&S.backup.every){
      var bd=backupDue(),bt=bd?at(bd):null;
      if(bt&&bt<=now)bt=at(addDays(td,1));
      if(bt)out.push({t:bt,title:'伴獸筆記：該備份資料了',body:'已經一段時間沒匯出備份，打開 App 到「設定 → 匯出備份」存一份到雲端硬碟。'});
    }
    out.sort(function(a,b){return a.t-b.t});
    return out.slice(0,60).map(function(o,i){return {id:i+1,title:o.title,body:o.body,schedule:{at:o.t,allowWhileIdle:true}}});
  }
  async function run(){
    var P=plug();if(!P)return;
    try{
      if(await status()!=='granted')return;
      var pend=await P.getPending();
      if(pend&&pend.notifications&&pend.notifications.length)await P.cancel({notifications:pend.notifications.map(function(n){return {id:n.id}})});
      var list=build();
      if(list.length)await P.schedule({notifications:list});
    }catch(e){}
  }
  function queue(){clearTimeout(timer);timer=setTimeout(run,800);if(!plug()&&typeof WebPush!=='undefined')WebPush.queue()}
  async function ensure(){
    if(!plug()||!anyReminder()||lsGet('petnote.notifAsked'))return;
    lsSet('petnote.notifAsked','1');
    var st=await status();
    if(st==='prompt'||st==='prompt-with-rationale')await ask();
    queue();
  }
  async function test(){
    var P=plug();if(!P)return false;
    try{await P.schedule({notifications:[{id:9999,title:'伴獸筆記',body:'這是測試通知，看到這則代表提醒功能正常。',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});return true}catch(e){return false}
  }
  return {status:status,ask:ask,ensure:ensure,test:test,sync:queue,build:build};
})();

var WebPush=(function(){
  var cfg=null,cfgP=null,timer=null;
  function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
  function standalone(){try{return !!(navigator.standalone||matchMedia('(display-mode: standalone)').matches)}catch(e){return false}}
  function supported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https:$/.test(location.protocol)}
  function on(){return lsGet('petnote.push')==='on'}
  function device(){var d=lsGet('petnote.pushDev');if(!d){var a=crypto.getRandomValues(new Uint8Array(18));d=btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');lsSet('petnote.pushDev',d)}return d}
  function config(){if(cfgP)return cfgP;cfgP=fetch('push.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){cfg=j&&typeof j.server==='string'&&/^https:\/\//.test(j.server)?j.server.replace(/\/+$/,''):null;return cfg}).catch(function(){cfg=null;return null});return cfgP}
  async function post(path,body){var srv=await config();if(!srv)throw new Error('no server');var r=await fetch(srv+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({device:device()},body||{}))});if(!r.ok)throw new Error('http '+r.status);return r.json()}
  function keyBytes(b64){var s=b64.replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
  async function state(){
    if(isNative())return 'native';
    if(!supported())return isIOS()&&!standalone()?'ios-browser':'unsupported';
    if(isIOS()&&!standalone())return 'ios-browser';
    if(!await config())return 'noserver';
    if(Notification.permission==='denied')return 'denied';
    if(on()&&Notification.permission==='granted')return 'on';
    return 'off';
  }
  async function enable(){
    var perm=await Notification.requestPermission();
    if(perm!=='granted')return perm;
    await ensureSub();
    lsSet('petnote.push','on');await sync();return 'granted';
  }
  async function disable(){
    lsSet('petnote.push','off');
    try{var reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
    try{await post('/unsubscribe')}catch(e){}
  }
  async function sync(){
    if(!on()||!supported())return;
    try{var items=Notif.build().map(function(n){return {t:n.schedule.at.getTime(),title:n.title,body:n.body}});await post('/schedule',{items:items});lsSet('petnote.pushSynced',String(Date.now()))}catch(e){}
  }
  async function ensureSub(){
    var srv=await config();if(!srv)throw new Error('no server');
    var reg=await navigator.serviceWorker.ready;
    var key=(await (await fetch(srv+'/vapid')).json()).publicKey;
    var sub=await reg.pushManager.getSubscription();
    if(sub){var cur=sub.options&&sub.options.applicationServerKey;if(cur){var a=new Uint8Array(cur),b=keyBytes(key);if(a.length!==b.length||a.some(function(x,i){return x!==b[i]})){await sub.unsubscribe();sub=null}}}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:keyBytes(key)});
    await post('/subscribe',{subscription:sub.toJSON()});
    return sub;
  }
  async function refresh(){
    if(!on()||!supported()||Notification.permission!=='granted')return;
    // 訂閱遺失時（例如瀏覽器更新、Service Worker 重裝）自動重新訂閱，不要直接變回「未開啟」
    try{await ensureSub();await sync()}catch(e){lsSet('petnote.pushErr',String(e&&e.message||e))}
  }
  async function test(){
    if(Notification.permission!=='granted')return {ok:false,why:'perm'};
    try{await ensureSub()}catch(e){return {ok:false,why:'sub',detail:String(e&&e.message||e)}}
    var srv=await config();
    var r=await fetch(srv+'/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:device()})});
    var j=await r.json().catch(function(){return {}});
    if(!r.ok&&!j.status)j.status=r.status;
    return j;
  }
  function queue(){if(!on())return;clearTimeout(timer);timer=setTimeout(sync,1500)}
  return {state:state,enable:enable,disable:disable,sync:sync,queue:queue,refresh:refresh,test:test,isIOS:isIOS};
})();

async function updateNotifCard(){
  paintBackupTxt();updateStorage();updateBuild();
  var st=await Notif.status(),t=$('#notifTxt'),b=$('#notifBtns');
  if(!t||!b)return;
  if(st==='web'){
    var ws=await WebPush.state();t=$('#notifTxt');b=$('#notifBtns');if(!t||!b)return;
    var wm={
      'ios-browser':'iPhone 要先把伴獸筆記加到主畫面，才能收到通知：\n1. 用 Safari 打開這個網頁\n2. 點下方「分享」→「加入主畫面」\n3. 從主畫面的伴獸筆記圖示打開，再回到這裡開啟通知\n（需要 iOS 16.4 以上）',
      unsupported:'這個瀏覽器不支援網頁通知。快到期的預防針與本月驅蟲會顯示在首頁最上方。',
      noserver:'這個網頁版還沒設定通知伺服器，快到期的提醒會顯示在首頁最上方。',
      denied:'通知被關閉了。iPhone 請到「設定 → 通知 → 伴獸筆記」開啟；其他瀏覽器請在網站設定裡允許通知。',
      on:'通知已開啟。預防針、驅蟲與備份提醒會在早上 9:00 送到這支手機。\n更改提醒設定後會自動同步。',
      off:'開啟後，預防針、驅蟲與備份提醒會在早上 9:00 送到這支手機。'
    };
    t.style.whiteSpace='pre-line';t.textContent=wm[ws]||'';
    b.innerHTML=ws==='on'?'<div class="row" style="margin-top:12px"><button class="btn" data-act="wpushtest">傳送測試通知</button><button class="btn" data-act="wpushoff">關閉通知</button></div><small id="wpushDiag" style="display:block;margin-top:8px;color:var(--bad);word-break:break-all"></small><small style="display:block;margin-top:8px">開啟通知時，提醒的標題與時間會存到通知伺服器，只用來在時間到時送出通知，關閉後就會刪除。</small>':(ws==='off'?'<button class="btn primary block" data-act="wpushon" style="margin-top:12px">'+ico('bell',20)+'開啟通知</button><small style="display:block;margin-top:8px">開啟後，提醒的標題與時間會存到通知伺服器，只用來在時間到時送出通知。</small>':'');
    return;
  }
  var msg={
    web:'網頁版不會跳出手機通知，快到期的預防針與本月驅蟲會顯示在首頁最上方。Android 手機安裝 App 版，才會在早上 9:00 跳通知。',
    granted:'通知已開啟。預防針與驅蟲會依你設定的提醒時間，在早上 9:00 通知你。',
    denied:'通知被關閉了。請到手機「設定 → 應用程式 → 伴獸筆記 → 通知」開啟。',
    error:'暫時無法確認通知狀態。'
  };
  t.textContent=msg[st]||'尚未允許通知，開啟後才能收到提醒。';
  b.innerHTML=st==='granted'?'<button class="btn block" data-act="notiftest" style="margin-top:12px">傳送測試通知</button>':((st==='prompt'||st==='prompt-with-rationale')?'<button class="btn primary block" data-act="notifask" style="margin-top:12px">開啟通知</button>':'');
}

var qTimer=null;
document.addEventListener('input',function(e){
  var t=e.target;if(!t||t.tagName!=='INPUT')return;var im=t.getAttribute('inputmode');if(im!=='decimal'&&im!=='numeric')return;
  var v=t.value,o=v.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[．。，,]/g,'.');
  if(im==='numeric')o=o.replace(/[^0-9]/g,'');else{o=o.replace(/[^0-9.]/g,'');var di=o.indexOf('.');if(di>=0)o=o.slice(0,di+1)+o.slice(di+1).replace(/\./g,'')}
  if(o!==v){var pos=t.selectionStart-(v.length-o.length);t.value=o;try{t.setSelectionRange(Math.max(0,pos),Math.max(0,pos))}catch(err){}}
},true);

function applyTheme(){
  var v=lsGet('petnote.theme'),r=document.documentElement;
  if(v==='light'||v==='dark')r.setAttribute('data-theme',v);else if(v==='system')r.removeAttribute('data-theme');
  if(typeof applyPetTheme==='function')applyPetTheme();
}

/* ================= 啟動 ================= */
(async function init(){
  applyTheme();
  await DB.open();
  S.pets=(await DB.all('pets')).sort(function(a,b){return a.created-b.created});
  S.logs=await DB.all('logs');S.worms=await DB.all('worms');S.vaccs=await DB.all('vaccines');
  var metas=await DB.all('meta');
  var bm=metas.filter(function(m){return m.id==='backup'})[0];
  if(bm){S.backup={since:bm.since||Date.now(),last:bm.last||0,every:bm.every==null?30:bm.every}}else{S.backup={since:Date.now(),last:0,every:30};await DB.put('meta',Object.assign({id:'backup'},S.backup))}
  var fm=metas.filter(function(m){return m.id==='foods'})[0];S.foods=fm&&Array.isArray(fm.items)?fm.items:[];
  var meta=metas.filter(function(m){return m.id==='vaccLib'})[0],gmeta=metas.filter(function(m){return m.id==='vaccGroups'})[0];
  if(meta&&Array.isArray(meta.items)){
    S.lib=meta.items;
    if(gmeta&&Array.isArray(gmeta.items))S.groups=gmeta.items;else autoGroup();
  }else{S.lib=JSON.parse(JSON.stringify(DEFAULT_LIB));S.groups=JSON.parse(JSON.stringify(DEFAULT_GROUPS));libDirty=true}
  S.pets.forEach(ensurePet);
  if(libDirty)await saveLib();
  for(var mi=0;mi<S.pets.length;mi++){if(S.pets[mi]._mig)await savePet(S.pets[mi])}
  var s=lsGet('petnote.sel');S.sel=(S.pets.filter(function(p){return p.id===s})[0]||S.pets[0]||{}).id||null;
  if(S.logs.some(function(l){return (l.photos||[]).some(function(p){return !Photos.isId(p)})})){S.tab='timeline';await migratePhotos();S.tab='home'}
  render();Notif.sync();animEnter();
  feederTick();
  setTimeout(function(){Updater.check(false)},2500);
  if(!DB.ok)toast('目前無法永久儲存資料');
  else{var lv=lsGet('petnote.ver');if(lv&&lv!==APP_VERSION)toast('已更新到 '+APP_VERSION+' 版，資料都還在');lsSet('petnote.ver',APP_VERSION)}
  try{
    var cap=window.Capacitor,native=cap&&cap.isNativePlatform&&cap.isNativePlatform();
    if(!native&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').then(function(){WebPush.refresh()}).catch(function(){});
    if(!native&&navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(function(p){if(!p)return navigator.storage.persist()}).catch(function(){});
  }catch(e){}
})();
})();
